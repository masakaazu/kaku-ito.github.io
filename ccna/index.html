<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>CCNA（200-301）｜資格学習支援サイト</title>
  <link rel="stylesheet" href="../assets/css/site.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
</head>

<body>
  <main>
    <header class="hero">
      <span class="hero-label">CCNA</span>
      <h1>CCNA（200-301）</h1>
      <p>Ciscoのネットワーク資格。応用情報のネットワーク分野を土台に、スイッチ・ルータの設定と動作まで踏み込む。</p>

      <div class="hero-meta">
        <span data-site-text="ccna:status"></span>
        <span>試験日：<span data-site-text="ccna:exam"></span></span>
        <span>教材のある分野：<span data-site-text="ccna:fields"></span></span>
      </div>
    </header>

    <section class="section">
      <div class="section-title">
        <h2>分野マップ</h2>
        <span>Cisco の出題範囲（v1.1）</span>
      </div>
      <p class="legend">試験は120分で、出題範囲は6分野（1.0〜6.0、右の割合は出題の比重）。ここでは近い項目をまとめて25の小分野にした。小分野の下の番号は、公式の出題範囲の項目番号。</p>

      <div data-site-list="field-map" data-topic="ccna"></div>
    </section>

    <section class="section" data-wrong-section hidden>
      <div class="section-title">
        <h2>間違えた問題</h2>
        <span>最後の回答が不正解のまま</span>
      </div>
      <p class="legend">正解するとここから消える。用語集は、間違えた用語だけのクイズで開く。</p>

      <div data-site-list="wrong" data-topic="ccna"></div>
    </section>

    <section class="section">
      <div class="section-title">
        <h2>最近追加した教材</h2>
      </div>

      <div data-site-list="latest" data-topic="ccna" data-count="5"></div>
    </section>

    <footer>資格学習支援サイト｜CCNA（200-301）</footer>
  </main>

  <script src="../assets/js/catalog.js"></script>
  <script src="../assets/js/site.js"></script>
</body>
</html>
