<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e1f21">
  <title>ページが見つかりません｜資格学習支援サイト</title>
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>
    /*
      旧URL → 新URL の転送（2026年10月のサイト再構成で移動したページ）
      GitHub Pages は存在しないURLでこのページを返すため、ここで転送先を判定する。
    */
    (() => {
      const moves = [
        [/^\/review\/?(.*)$/, "/fe/review/$1"],
        // 学習WBSは2026年10月に廃止。基本情報のページへ案内する
        [/^\/(fe\/)?wbs(\/.*)?$/, "/fe/index.html"],
        [/^\/advanced\/advancedno(\d+)\.html$/, "/ap/notes/apno$1.html"],
        [/^\/advanced\/?(index\.html)?$/, "/ap/notes/index.html"],
        [/^\/(it-english-300|it-acronyms-300)\.html$/, "/common/$1.html"],
      ];
      const path = location.pathname;
      for (const [pattern, target] of moves) {
        if (pattern.test(path)) {
          location.replace(path.replace(pattern, target) + location.search + location.hash);
          return;
        }
      }
    })();
  </script>
</head>

<body>
  <main>
    <header class="hero">
      <span class="hero-label">404</span>
      <h1>ページが見つかりません</h1>
      <p>URLが変わったか、ページが削除された可能性があります。</p>
    </header>

    <section class="section">
      <div class="grid">
        <a class="card" href="/index.html">
          <span class="card-icon">TOP</span>
          <h3>資格学習支援サイト</h3>
          <p>トップページから目的の教材を探す。</p>
          <span class="arrow">トップへ →</span>
        </a>
      </div>
    </section>

    <footer>資格学習支援サイト</footer>
  </main>
</body>
</html>
