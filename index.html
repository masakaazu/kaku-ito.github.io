<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e1f21">
  <title>資格学習支援サイト</title>
  <link rel="stylesheet" href="./assets/css/site.css">
</head>

<body>
  <main>
    <header class="hero">
      <span class="hero-label">Study Support</span>
      <h1>資格学習支援サイト</h1>
      <p>資格ごとに、学習計画・復習教材・知識ノートをまとめて管理する。</p>

      <div class="today-box">
        <div>
          <small data-site-text="today">今日</small>
          <strong>いま取り組んでいる資格：応用情報技術者試験</strong>
        </div>
        <span class="status status-active" data-site-text="ap-status">学習中</span>
      </div>
    </header>

    <section class="section">
      <div class="section-title">
        <h2>資格トピック</h2>
      </div>

      <div class="grid">
        <a class="card topic-ap" href="./ap/index.html">
          <div class="card-head">
            <span class="card-icon">AP</span>
            <span class="status status-active" data-site-text="ap-status">学習中</span>
          </div>
          <h3>応用情報技術者試験</h3>
          <p>試験日：<span data-site-text="ap-exam">未定</span><br>昼休みノートの知識ストックで理解を積み上げる。</p>
          <span class="arrow">応用情報を開く →</span>
        </a>

        <a class="card" href="./fe/index.html">
          <div class="card-head">
            <span class="card-icon">FE</span>
            <span class="status status-done" data-site-text="fe-status">受験済み</span>
          </div>
          <h3>基本情報技術者試験</h3>
          <p>試験日：<span data-site-text="fe-exam">2026年10月3日（土）</span><br>学習WBSと日別の復習教材を残している。</p>
          <span class="arrow">基本情報を開く →</span>
        </a>
      </div>
    </section>

    <section class="section" id="common">
      <div class="section-title">
        <h2>共通教材</h2>
        <span>どの資格にも使える教材</span>
      </div>

      <div data-site-list="common"></div>
    </section>

    <footer>資格学習支援サイト</footer>
  </main>

  <script src="./assets/js/catalog.js"></script>
  <script src="./assets/js/site.js"></script>
</body>
</html>
