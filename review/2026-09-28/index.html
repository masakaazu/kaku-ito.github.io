<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2476c9" />
    <title>2026年9月28日｜復習教材一覧</title>
    <style>
      :root {
        --navy: #15253d;
        --blue: #2476c9;
        --line: #d9e2ef;
        --ink: #172033;
        --muted: #5e6b7d;
        --shadow: 0 5px 18px rgba(17, 37, 63, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f7fb;
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Yu Gothic", Meiryo, sans-serif;
        line-height: 1.65;
      }
      header {
        padding: 30px 16px 26px;
        color: #fff;
        background: linear-gradient(135deg, #142744, #2476c9);
      }
      .wrap {
        width: min(880px, calc(100% - 32px));
        margin: 0 auto;
      }
      .eyebrow {
        margin: 0 0 5px;
        font-size: 0.84rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        opacity: 0.8;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 5vw, 2.3rem);
        line-height: 1.3;
      }
      .lead {
        margin: 8px 0 0;
        opacity: 0.92;
      }
      main {
        padding: 26px 0 52px;
      }
      .heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 13px;
      }
      h2 {
        margin: 0;
        font-size: 1.28rem;
      }
      .count {
        color: var(--muted);
        font-size: 0.86rem;
      }
      .items {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 12px;
      }
      .item {
        display: block;
        min-height: 165px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        color: inherit;
        text-decoration: none;
        background: #fff;
        box-shadow: var(--shadow);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .item:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(17, 37, 63, 0.13);
      }
      .number {
        color: var(--blue);
        font-size: 0.82rem;
        font-weight: 800;
      }
      .item strong {
        display: block;
        margin-top: 5px;
        color: var(--navy);
        font-size: 1.08rem;
      }
      .item p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .arrow {
        display: block;
        margin-top: 13px;
        color: var(--blue);
        font-size: 0.84rem;
        font-weight: 700;
      }
      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 26px;
      }
      .nav a {
        color: var(--blue);
        font-weight: 700;
        text-decoration: none;
      }
      footer {
        padding: 0 0 28px;
        color: var(--muted);
        font-size: 0.82rem;
      }
      @media (max-width: 560px) {
        header {
          padding-top: 22px;
        }
        .items {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <p class="eyebrow">基本情報技術者試験｜復習教材</p>
        <h1>2026年9月28日</h1>
        <p class="lead">計算問題の教材を選んで復習を始めます。</p>
      </div>
    </header>
    <main class="wrap">
      <div class="heading">
        <h2>教材を選ぶ</h2>
        <span class="count">2教材</span>
      </div>
      <div class="items">
        <a class="item" href="928no1.html"
          ><span class="number">教材 1</span
          ><strong>数値表現・論理演算・性能評価</strong>
          <p>基本情報で頻出する計算公式と数値問題を復習します。</p>
          <span class="arrow">教材を開く →</span></a
        >
        <a class="item" href="928no2.html"
          ><span class="number">教材 2</span
          ><strong>ネットワーク・経営分析・誤り検出</strong>
          <p>ネットワーク計算、経営指標、誤り検出の問題を復習します。</p>
          <span class="arrow">教材を開く →</span></a
        >
      </div>
      <nav class="nav" aria-label="関連ページ">
        <a href="../index.html">復習教材一覧</a
        ><a href="../../index.html">学習ポータルに戻る</a>
      </nav>
    </main>
    <footer class="wrap">2026年9月28日の復習教材</footer>
  </body>
</html>
