<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>基本情報 復習教材｜記憶装置・インタフェース・OS</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #fff;
        --ink: #172033;
        --muted: #667085;
        --line: #dce3ef;
        --primary: #275dad;
        --primary2: #e9f1ff;
        --ok: #087443;
        --ng: #b42318;
        --warn: #a15c00;
        --shadow: 0 5px 18px rgba(30, 55, 90, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic",
          Meiryo, sans-serif;
        line-height: 1.65;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .wrap {
        width: min(980px, calc(100% - 24px));
        margin: auto;
      }
      .hero {
        background: linear-gradient(135deg, #173d77, #3477cd);
        color: #fff;
        padding: 24px 0 20px;
      }
      .hero h1 {
        font-size: clamp(1.35rem, 4vw, 2rem);
        line-height: 1.3;
        margin: 0 0 5px;
      }
      .hero p {
        margin: 0;
        opacity: 0.88;
        font-size: 0.92rem;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
        margin-top: 17px;
      }
      .stat {
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 12px;
        padding: 9px;
        text-align: center;
      }
      .stat b {
        display: block;
        font-size: 1.15rem;
      }
      .stat span {
        font-size: 0.73rem;
        opacity: 0.9;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 13px 0;
      }
      .btn {
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fff;
        color: var(--ink);
        padding: 8px 11px;
        font-size: 0.86rem;
      }
      .btn.primary {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }
      .btn.active {
        background: #fff4e5;
        border-color: #f4bb68;
        color: #8a4b00;
      }
      .tabs {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding-bottom: 5px;
        margin: 2px 0 16px;
      }
      .tab {
        border: 1px solid var(--line);
        border-radius: 999px;
        white-space: nowrap;
        padding: 8px 13px;
        background: #fff;
        color: #344054;
        font-size: 0.88rem;
      }
      .tab.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }
      .section-title {
        font-size: 1.2rem;
        margin: 5px 0 8px;
      }
      .lead {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 0 12px;
      }
      .note {
        border-left: 4px solid #ef9d22;
        background: #fff8e9;
        padding: 10px 12px;
        border-radius: 5px;
        margin: 12px 0;
        font-size: 0.88rem;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 11px;
      }
      .flash {
        width: 100%;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        background: var(--card);
        box-shadow: var(--shadow);
        min-height: 145px;
      }
      .flash:hover {
        border-color: #98b9ed;
      }
      .flash .hint {
        color: var(--primary);
        font-size: 0.76rem;
        font-weight: 700;
      }
      .flash h3 {
        font-size: 1rem;
        margin: 5px 0;
      }
      .flash .answer {
        display: none;
        border-top: 1px dashed var(--line);
        margin-top: 9px;
        padding-top: 9px;
        color: #344054;
        font-size: 0.86rem;
      }
      .flash.open .answer {
        display: block;
      }
      .label {
        font-weight: 700;
        color: #334155;
      }
      .formula {
        background: #eff6ff;
        border: 1px solid #bed6fb;
        padding: 12px;
        border-radius: 10px;
        margin: 13px 0;
      }
      .formula code {
        display: block;
        font-family: ui-monospace, Menlo, monospace;
        font-weight: 700;
        color: #173d77;
        background: #fff;
        padding: 7px;
        border-radius: 6px;
        margin: 7px 0;
        white-space: normal;
      }
      .quiz {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 15px;
        margin: 12px 0;
        box-shadow: var(--shadow);
      }
      .qnum {
        font-size: 0.77rem;
        color: var(--primary);
        font-weight: 800;
      }
      .quiz h3 {
        font-size: 1rem;
        margin: 4px 0 10px;
      }
      .choices {
        display: grid;
        gap: 7px;
      }
      .choice {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 8px;
        text-align: left;
        padding: 9px 10px;
        font-size: 0.9rem;
      }
      .choice:not(:disabled):hover {
        background: #f5f9ff;
        border-color: #8ab1ee;
      }
      .choice.correct {
        background: #ecfdf3;
        border-color: #75d6a5;
        color: #075d35;
      }
      .choice.wrong {
        background: #fff0f0;
        border-color: #ef9b95;
        color: #a21c16;
      }
      .choice:disabled {
        cursor: default;
      }
      .feedback {
        display: none;
        margin: 10px 0 0;
        padding: 9px 10px;
        border-radius: 7px;
        font-size: 0.87rem;
      }
      .feedback.show {
        display: block;
      }
      .feedback.ok {
        background: #ecfdf3;
        color: #075d35;
      }
      .feedback.ng {
        background: #fff0f0;
        color: #8e1b16;
      }
      .todayBox {
        display: none;
      }
      .todayBox.show {
        display: block;
      }
      .todayHead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .todayBox .quiz {
        margin: 10px 0;
      }
      .empty {
        padding: 18px;
        background: #fff;
        border: 1px dashed var(--line);
        border-radius: 10px;
        color: var(--muted);
        text-align: center;
      }
      .footer {
        font-size: 0.78rem;
        color: var(--muted);
        padding: 22px 0 38px;
      }
      @media (max-width: 480px) {
        .wrap {
          width: min(100% - 18px, 980px);
        }
        .hero {
          padding-top: 18px;
        }
        .stats {
          gap: 6px;
        }
        .stat {
          padding: 7px 3px;
        }
        .toolbar .btn {
          flex: 1;
        }
        .cards {
          grid-template-columns: 1fr;
        }
        .quiz {
          padding: 13px;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="wrap">
        <h1>基本情報 復習教材</h1>
        <p>
          記憶装置・入出力インタフェース・ソフトウェア／OS｜カードをタップして答えを確認
        </p>
        <div class="stats">
          <div class="stat"><b id="answered">0</b><span>解答数</span></div>
          <div class="stat"><b id="rate">—</b><span>正答率</span></div>
          <div class="stat">
            <b id="learned">0</b><span>学習済み問題数</span>
          </div>
        </div>
      </div>
    </header>
    <main class="wrap">
      <div class="toolbar">
        <button class="btn primary" id="todayBtn">🎲 今日の10問</button
        ><button class="btn" id="weakBtn">⚠️ 苦手問題だけ</button
        ><button class="btn" id="resetBtn">進捗をリセット</button>
      </div>
      <div class="todayBox" id="todayBox">
        <div class="todayHead">
          <h2 class="section-title">今日の10問</h2>
          <button class="btn" id="closeToday">閉じる</button>
        </div>
        <p class="lead">
          全問題からランダムに最大10問を出題します。毎回「今日の10問」を押すと問題を選び直します。
        </p>
        <div id="todayQuestions"></div>
      </div>
      <div id="normalContent">
        <nav class="tabs" id="tabs"></nav>
        <div id="panels"></div>
      </div>
      <p class="footer">
        この教材はブラウザ内の localStorage
        に解答履歴・正答率・苦手問題を保存します。外部通信は行いません。
      </p>
    </main>

              "スプーリング",
              "一言でいうと：低速な入出力装置との速度差を埋めるため、データを補助記憶装置に一時保存すること。",
              "試験で問われやすいポイント：代表例はプリンタ。印刷待ちデータをため、CPUなどの処理を先へ進めやすくする。\n混同しやすい用語との違い：バッファリングは主に主記憶上の一時記憶を指すことが多い。",
            ],
            [
              "実行可能状態",
              "一言でいうと：CPUが割り当てられれば実行できる状態。",
              "試験で問われやすいポイント：処理中ではなく、「CPUの処理を待っている」状態。\n混同しやすい用語との違い：実行状態は現在CPUで処理されている。",
            ],
            [
              "実行状態",
              "一言でいうと：タスクがCPUで実際に処理されている状態。",
              "試験で問われやすいポイント：CPUを使用中であることが決め手。\n混同しやすい用語との違い：実行可能状態はCPUを待つ状態。",
            ],
            [
              "待機状態",
              "一言でいうと：入出力処理などの終了を待っている状態。",
              "試験で問われやすいポイント：I/Oの完了後、通常は実行可能状態へ移る。\n混同しやすい用語との違い：実行可能状態はCPU待ち、待機状態は入出力などのイベント待ち。",
            ],
          ],
          questions: [
            [
              "プリンタのような低速な装置との速度差を埋めるため、データを補助記憶装置に一時保存する仕組みはどれか。",
              [
                "スプーリング",
                "ミラーリング",
                "フラグメンテーション",
                "パリティ",
              ],
              0,
              "スプーリングです。印刷データを一時保存して、低速なプリンタの処理を待ちます。",
            ],
            [
              "CPUが割り当てられれば実行できるが、現在はCPUを待っているタスクの状態はどれか。",
              ["実行状態", "実行可能状態", "待機状態", "終了状態"],
              1,
              "実行可能状態はCPUの割当てを待っている状態です。",
            ],
            [
              "タスクがCPUによって処理されている状態はどれか。",
              ["待機状態", "実行状態", "実行可能状態", "スプーリング状態"],
              1,
              "実行状態は、タスクがCPUを使用して実際に処理されている状態です。",
            ],
            [
              "入出力処理の終了を待っているタスクの状態はどれか。",
              ["実行可能状態", "実行状態", "待機状態", "RAID状態"],
              2,
              "待機状態はI/O完了などのイベントを待っており、CPUを割り当てても直ちに実行できない状態です。",
            ],
          ],
        },
      ];
      const allQuestions = sections.flatMap((s) =>
        s.questions.map((q, i) => ({ q, section: s.name, id: s.id + "-" + i })),
      );
      const key = "feReviewStorageInterfaceOS_v1";
      let state = JSON.parse(localStorage.getItem(key) || '{"answers":{}}');
      function save() {
        localStorage.setItem(key, JSON.stringify(state));
        updateStats();
      }
      function updateStats() {
        const a = Object.values(state.answers),
          n = a.length,
          c = a.filter((x) => x.correct).length;
        document.querySelector("#answered").textContent = n;
        document.querySelector("#rate").textContent = n
          ? Math.round((c / n) * 100) + "%"
          : "—";
        document.querySelector("#learned").textContent = new Set(
          a.map((x) => x.id),
        ).size;
      }
      function esc(s) {
        return s.replace(
          /[&<>]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
        );
      }
      function cardHTML(c) {
        let [t, one, detail] = c;
        return `<button class="flash" type="button"><div class="hint">タップして答え・解説を表示</div><h3>${t}</h3><div class="answer"><div>${one}</div><div style="margin-top:7px;white-space:pre-line">${detail}</div></div></button>`;
      }
      function questionHTML(item, index) {
        let [text, opts, correct, exp] = item.q,
          prev = state.answers[item.id];
        return `<article class="quiz" data-id="${item.id}"><div class="qnum">${item.section}｜問題 ${index + 1}</div><h3>${text}</h3><div class="choices">${opts.map((o, i) => `<button class="choice ${prev ? (i === correct ? "correct" : i === prev.selected ? "wrong" : "") : ""}" data-choice="${i}" ${prev ? "disabled" : ""}>${String.fromCharCode(65 + i)}. ${o}</button>`).join("")}</div><div class="feedback ${prev ? "show " + (prev.correct ? "ok" : "ng") : ""}">${prev ? (prev.correct ? "○ 正解！ " : "× 不正解。正解は " + String.fromCharCode(65 + correct) + "。") + exp : ""}</div></article>`;
      }
      function render() {
        document.querySelector("#tabs").innerHTML = sections
          .map(
            (s, i) =>
              `<button class="tab ${i === 0 ? "active" : ""}" data-tab="${s.id}">${s.name}</button>`,
          )
          .join("");
        document.querySelector("#panels").innerHTML = sections
          .map(
            (s, i) =>
              `<section class="panel ${i === 0 ? "active" : ""}" id="${s.id}"><h2 class="section-title">${s.name}</h2><p class="lead">${s.lead}</p>${s.id === "storage" ? '<div class="note">要確認：ノートのHDDセクタに関する2行目は一部判読が難しいため、教材本文には断定して反映していません。</div>' : ""}<h3>用語カード</h3><div class="cards">${s.cards.map(cardHTML).join("")}</div>${s.formula ? `<div class="formula"><b>${s.formula.title}</b><div>${s.formula.body}</div></div>` : ""}<h3>4択クイズ</h3>${s.questions.map((q, j) => questionHTML({ q, section: s.name, id: s.id + "-" + j }, j)).join("")}</section>`,
          )
          .join("");
        bind();
      }
      function bind() {
        document
          .querySelectorAll(".flash")
          .forEach((x) => (x.onclick = () => x.classList.toggle("open")));
        document.querySelectorAll(".tab").forEach(
          (x) =>
            (x.onclick = () => {
              document
                .querySelectorAll(".tab,.panel")
                .forEach((e) => e.classList.remove("active"));
              x.classList.add("active");
              document
                .querySelector("#" + x.dataset.tab)
                .classList.add("active");
              window.scrollTo({
                top: document.querySelector(".tabs").offsetTop - 8,
                behavior: "smooth",
              });
            }),
        );
        document
          .querySelectorAll(".choice")
          .forEach((b) => (b.onclick = answer));
      }
      function answer(e) {
        const b = e.currentTarget,
          box = b.closest(".quiz"),
          id = box.dataset.id,
          item = allQuestions.find((x) => x.id === id),
          selected = Number(b.dataset.choice),
          correct = item.q[2];
        state.answers[id] = {
          id,
          selected,
          correct: selected === correct,
          at: Date.now(),
        };
        save();
        if (window.recordAnswer) {
          window.recordAnswer(
            "915no2-" + item.id,
            item.section,
            selected === correct,
          );
        }
        box.querySelectorAll(".choice").forEach((x) => {
          x.disabled = true;
          let n = Number(x.dataset.choice);
          if (n === correct) x.classList.add("correct");
          else if (n === selected) x.classList.add("wrong");
        });
        let f = box.querySelector(".feedback");
        f.className = "feedback show " + (selected === correct ? "ok" : "ng");
        f.textContent =
          (selected === correct
            ? "○ 正解！ "
            : "× 不正解。正解は " + String.fromCharCode(65 + correct) + "。") +
          item.q[3];
      }
      function showToday(items, title) {
        document.querySelector("#normalContent").style.display = "none";
        let box = document.querySelector("#todayBox");
        box.classList.add("show");
        box.querySelector(".section-title").textContent = title;
        document.querySelector("#todayQuestions").innerHTML = items.length
          ? items.map((x, i) => questionHTML(x, i)).join("")
          : '<div class="empty">苦手問題はまだありません。クイズに答えると、不正解だった問題がここに表示されます。</div>';
        document
          .querySelectorAll("#todayQuestions .choice")
          .forEach((b) => (b.onclick = answer));
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      document.querySelector("#todayBtn").onclick = () =>
        showToday(
          [...allQuestions].sort(() => Math.random() - 0.5).slice(0, 10),
          "今日の10問",
        );
      document.querySelector("#weakBtn").onclick = () =>
        showToday(
          allQuestions.filter(
            (x) => state.answers[x.id] && !state.answers[x.id].correct,
          ),
          "苦手問題",
        );
      document.querySelector("#closeToday").onclick = () => {
        document.querySelector("#todayBox").classList.remove("show");
        document.querySelector("#normalContent").style.display = "block";
      };
      document.querySelector("#resetBtn").onclick = async () => {
        if (
          confirm(
            "解答履歴・正答率・苦手問題をすべて削除します。よろしいですか？",
          )
        ) {
          state = { answers: {} };
          save();
          render();

          if (window.resetReviewProgress) {
            const resetButton = document.querySelector("#resetBtn");
            resetButton.disabled = true;
            resetButton.textContent = "クラウドをリセット中...";

            const result = await window.resetReviewProgress();

            resetButton.disabled = false;
            resetButton.textContent = "進捗をリセット";

            if (!result.ok && result.reason === "error") {
              alert(
                "クラウド側のリセットに失敗しました。通信状態を確認して、もう一度お試しください。",
              );
            }
          }
        }
      };
      render();
      updateStats();
    </script>

      <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:45px;">

        <a href="../../index.html" style="color:#2476c9; font-weight:700; text-decoration:none;">学習ポータルに戻る</a>
      </div>
    </div>
    <script src="../../assets/js/fe-study-sync.js"></script>
  </body>
