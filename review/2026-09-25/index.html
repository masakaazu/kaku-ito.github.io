<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2476c9">
  <title>2026年9月25日｜復習教材一覧</title>
  <style>
    :root {
      --navy: #15253d;
      --blue: #2476c9;
      --line: #d9e2ef;
      --ink: #172033;
      --muted: #5e6b7d;
      --shadow: 0 5px 18px rgba(17, 37, 63, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f7fb;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.65;
    }

    header {
      padding: 30px 16px 26px;
      color: #fff;
      background: linear-gradient(135deg, #142744, #2476c9);
    }

    .wrap { width: min(880px, calc(100% - 32px)); margin: 0 auto; }
    .eyebrow { margin: 0 0 5px; font-size: .84rem; font-weight: 700; letter-spacing: .08em; opacity: .8; }
    h1 { margin: 0; font-size: clamp(1.55rem, 5vw, 2.3rem); line-height: 1.3; }
    .lead { margin: 8px 0 0; opacity: .92; }
    main { padding: 26px 0 52px; }
    .heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    h2 { margin: 0; font-size: 1.28rem; }
    .count { color: var(--muted); font-size: .86rem; }
    .items { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }

    .item {
      display: block;
      min-height: 165px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      background: #fff;
      box-shadow: var(--shadow);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .item:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(17, 37, 63, .13); }
    .number { color: var(--blue); font-size: .82rem; font-weight: 800; }
    .item strong { display: block; margin-top: 5px; color: var(--navy); font-size: 1.08rem; }
    .item p { margin: 7px 0 0; color: var(--muted); font-size: .9rem; }
    .arrow { display: block; margin-top: 13px; color: var(--blue); font-size: .84rem; font-weight: 700; }
    .nav { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 26px; }
    .nav a { color: var(--blue); font-weight: 700; text-decoration: none; }
    footer { padding: 0 0 28px; color: var(--muted); font-size: .82rem; }

    @media (max-width: 560px) {
      header { padding-top: 22px; }
      .items { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p class="eyebrow">基本情報技術者試験｜復習教材</p>
      <h1>2026年9月25日</h1>
      <p class="lead">今日の学習教材を選んで復習を始めます。</p>
    </div>
  </header>

  <main class="wrap">
    <div class="heading">
      <h2>教材を選ぶ</h2>
      <span class="count">1教材</span>
    </div>

    <div class="items">
      <a class="item" href="925no1.html">
        <span class="number">教材 1</span>
        <strong>メモリ・OS・記憶装置・セキュリティ総合復習</strong>
        <p>用語カード、クイズ、苦手復習に取り組みます。</p>
        <span class="arrow">教材を開く →</span>
      </a>
    </div>

    <nav class="nav" aria-label="関連ページ">
      <a href="../index.html">← 復習教材一覧</a>
      <a href="../../index.html">学習ポータルに戻る</a>
    </nav>
  </main>

  <footer class="wrap">2026年9月25日の復習教材</footer>
</body>
</html>
