<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マネジメント・法務・ネットワーク基礎｜9/13 教材3</title>
<style>
:root {
  --paper: #fffdf6;
  --bg: #eef3f7;
  --ink: #243142;
  --line: #d7e0e7;
  --blue: #2775b9;
  --blue-soft: #eaf5ff;
  --green: #25836c;
  --green-soft: #e5f7ec;
  --yellow: #fff7d6;
  --red: #b94b4b;
  --red-soft: #fdecec;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: linear-gradient(135deg, #edf5fb, #f8f5eb);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
    "Yu Gothic", Meiryo, sans-serif;
  line-height: 1.75;
}
.wrap { max-width: 1060px; margin: 0 auto; padding: 28px 18px 60px; }
header {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 26px;
  box-shadow: 0 8px 24px rgba(49, 93, 138, 0.08);
}
h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.2rem); }
.subtitle { margin: 4px 0 0; color: #5e6c7b; }
.flow {
  margin-top: 18px;
  padding: 14px 16px;
  border-radius: 12px;
  background: var(--blue-soft);
  font-weight: 700;
}
nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
nav a {
  color: #125c9f;
  background: white;
  border: 1px solid #cbdbe8;
  border-radius: 99px;
  padding: 5px 12px;
  text-decoration: none;
  font-size: 0.9rem;
}
section { margin-top: 28px; }
h2 { font-size: 1.3rem; margin: 0 0 14px; }
h3 { font-size: 1.05rem; margin: 0 0 10px; color: #174f82; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 3px 13px rgba(45, 70, 95, 0.05);
}
.card p { margin: 7px 0; }
.card ul { padding-left: 1.2em; margin: 7px 0; }
.term { font-weight: 800; color: #164f84; }
.note {
  background: var(--yellow);
  border-left: 4px solid #e8bd3d;
  padding: 11px 13px;
  border-radius: 8px;
  margin-top: 12px;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
th, td {
  padding: 11px 13px;
  border: 1px solid var(--line);
  vertical-align: top;
  text-align: left;
}
th { color: #174f82; background: #eff7fd; white-space: nowrap; }

.quizbox {
  margin-top: 22px;
  background: var(--green-soft);
  border: 1px solid #b8dfcf;
  border-radius: 16px;
  padding: 18px;
}
.quizbox h3 { color: #1e5f4c; }
.quiz {
  padding: 14px 0;
  border-top: 1px solid #cfe7db;
}
.quiz:first-of-type { border-top: 0; }
.qno {
  font-size: 0.78rem;
  color: var(--blue);
  font-weight: 800;
}
.question { font-weight: 700; margin: 3px 0 10px; }
.choices { display: grid; gap: 7px; }
.choice {
  width: 100%;
  text-align: left;
  font: inherit;
  border: 1px solid var(--line);
  padding: 10px 11px;
  border-radius: 9px;
  background: #ffffff;
  cursor: pointer;
  color: var(--ink);
}
.choice:hover:not(:disabled) {
  background: #f2f8ff;
  border-color: #83b6ea;
}
.choice:disabled { cursor: default; }
.choice.correct {
  background: var(--green-soft);
  border-color: #4ca96d;
}
.choice.wrong {
  background: var(--red-soft);
  border-color: #dd7770;
}
.feedback {
  margin: 9px 0 0;
  padding: 9px 11px;
  border-radius: 8px;
  background: #f4f7fb;
  font-size: 0.88rem;
}
.feedback.good { background: var(--green-soft); }
.feedback.bad { background: var(--red-soft); }

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin: 18px 0;
}
.stat {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  text-align: center;
}
.stat b { display: block; font-size: 1.3rem; }
.stat span { font-size: 0.76rem; color: #5e6c7b; }

footer {
  text-align: center;
  color: #66778a;
  font-size: 0.86rem;
  margin-top: 32px;
}

@media (max-width: 560px) {
  .stats { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .stat { padding: 8px 4px; }
  .stat b { font-size: 1.1rem; }
}
</style>
</head>

<body>
<main class="wrap">
  <header>
    <p class="subtitle">2026年9月13日｜復習教材3</p>
    <h1>マネジメント・法務・ネットワーク基礎</h1>
    <div class="flow">
      KGI/CSF/KPI、OR・IE、企業会計、知的財産権、標準化団体、
      NoSQL、SDN/OpenFlowを4択クイズで確認します。
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="answered">0</b><span>回答数</span></div>
    <div class="stat"><b id="accuracy">0%</b><span>正答率</span></div>
    <div class="stat"><b id="studied">0 / 5</b><span>取り組んだ問題</span></div>
  </div>

  <section class="quizbox">
    <h3>確認クイズ（5問）</h3>
    <p style="font-size:0.86rem;color:#3d6b58;margin:0 0 12px;">
      選択すると直後に解説が出ます。
    </p>
    <div id="mgmtQuiz"></div>
  </section>

  <footer>基本情報技術者試験｜マネジメント・法務・ネットワーク基礎</footer>
</main>

<script>
  const questions = [
    {
      id: "q1",
      cat: "management",
      q: "KGI・CSF・KPIの関係として最も適切なものはどれか。",
      a: [
        "KPIを達成するとCSFが決まり、その結果KGIが決まる",
        "KGI（最終目標）を達成するためのCSF（重要成功要因）を定め、\nその達成度をKPI（重要業績評価指標）で測る",
        "KGI・CSF・KPIはすべて同じ指標を指す別名である",
        "CSFはKPIを達成した後に事後的に決める指標である"
      ],
      correct: 1,
      e: "KGIが最終目標、CSFがそのための重要成功要因、KPIはCSFの達成度を測る指標です。"
    },
    {
      id: "q2",
      cat: "management",
      q: "OR（オペレーションズ・リサーチ）の目的として最も適切なものはどれか。",
      a: [
        "従業員の勤怠管理を自動化すること",
        "数理的・統計的手法を用いて、経営上の意思決定を最適化すること",
        "会計帳簿の記帳を自動で行うこと",
        "ネットワーク機器の稼働率を監視すること"
      ],
      correct: 1,
      e: "ORは数理モデルや統計を使い、資源配分や計画などの意思決定を最適化する手法です。"
    },
    {
      id: "q3",
      cat: "accounting",
      q: "損益分岐点（BEP）に関する記述として適切なものはどれか。",
      a: [
        "利益と損失がちょうど0になる売上高または販売数量のこと",
        "固定費だけを表す指標のこと",
        "変動費率を無視して計算する売上高のこと",
        "常に前年度の売上高と一致する値のこと"
      ],
      correct: 0,
      e: "損益分岐点は、売上高と総costが等しくなり利益がゼロになる点です。"
    },
    {
      id: "q4",
      cat: "law",
      q: "特許権・実用新案権・意匠権・商標権のうち、\n「発明」を保護する権利はどれか。",
      a: [
        "実用新案権",
        "意匠権",
        "特許権",
        "商標権"
      ],
      correct: 2,
      e: "特許権は高度な技術的発明を保護します。実用新案権は考案（小発明）、意匠権はデザイン、商標権はマークやロゴを保護します。"
    },
    {
      id: "q5",
      cat: "network",
      q: "SDN（Software-Defined Networking）の特徴として適切なものはどれか。",
      a: [
        "ネットワーク機器のハードウェアだけで制御機能を持つ方式",
        "制御機能（コントロールプレーン）と\nデータ転送機能（データプレーン）を分離し、\nソフトウェアで集中制御する方式",
        "無線LANのみに適用される暗号化方式",
        "メールサーバの負荷分散だけを行う技術"
      ],
      correct: 1,
      e: "SDNは制御とデータ転送を分離し、OpenFlowなどのプロトコルでソフトウェアから集中制御します。"
    }
  ];

  const KEY = "feNotebookReview913no3v1";

  let state = JSON.parse(
    localStorage.getItem(KEY) ||
      '{"answered":0,"correct":0,"seen":[],"wrong":[]}'
  );

  function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
    updateStats();
  }

  function updateStats() {
    document.getElementById("answered").textContent = state.answered;

    document.getElementById("accuracy").textContent =
      state.answered
        ? Math.round((state.correct / state.answered) * 100) + "%"
        : "0%";

    document.getElementById("studied").textContent =
      state.seen.length + " / " + questions.length;
  }

  function renderQuiz(target, list) {
    const el = document.getElementById(target);

    if (!list.length) {
      el.innerHTML = '<div class="empty">問題がありません。</div>';
      return;
    }

    el.innerHTML = list
      .map(
        (x, i) => `
        <article class="quiz" data-id="${x.id}">
          <div class="qno">Q${i + 1}</div>
          <div class="question">${x.q.replace(/\n/g, "<br>")}</div>
          <div class="choices">
            ${x.a
              .map(
                (v, n) => `
                <button class="choice" data-n="${n}">
                  ${String.fromCharCode(65 + n)}. ${v.replace(/\n/g, "<br>")}
                </button>
              `
              )
              .join("")}
          </div>
          <div class="feedback" hidden></div>
        </article>
      `
      )
      .join("");

    el.querySelectorAll(".quiz").forEach((box) => {
      box.querySelectorAll(".choice").forEach((btn) => {
        btn.addEventListener("click", () =>
          answer(box, Number(btn.dataset.n))
        );
      });
    });
  }

  function answer(box, n) {
    if (box.dataset.done) return;
    box.dataset.done = "1";

    const q = questions.find((x) => x.id === box.dataset.id);
    const ok = n === q.correct;

    state.answered++;
    if (ok) state.correct++;

    if (!state.seen.includes(q.id)) state.seen.push(q.id);

    if (ok) {
      state.wrong = state.wrong.filter((id) => id !== q.id);
    } else if (!state.wrong.includes(q.id)) {
      state.wrong.push(q.id);
    }

    box.querySelectorAll(".choice").forEach((b) => {
      b.disabled = true;
      const k = Number(b.dataset.n);
      if (k === q.correct) b.classList.add("correct");
      if (k === n && !ok) b.classList.add("wrong");
    });

    const fb = box.querySelector(".feedback");
    fb.hidden = false;
    fb.className = "feedback " + (ok ? "good" : "bad");
    fb.innerHTML =
      (ok
        ? "<b>正解！</b> "
        : "<b>不正解。</b> 正解は " +
          String.fromCharCode(65 + q.correct) +
          "。") + q.e;

    save();

    /* Supabaseへ正答・誤答を同期 */
    if (window.recordAnswer) {
      window.recordAnswer("913no3-" + q.id, q.cat, ok);
    }
  }

  renderQuiz("mgmtQuiz", questions);
  updateStats();
</script>
<div style="padding: 18px 0 24px; text-align: center;">
  <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:45px;">
    <a href="index.html" style="color:#2476c9; font-weight:700; text-decoration:none;">← 目次に戻る</a>
    <a href="../index.html" style="color:#2476c9; font-weight:700; text-decoration:none;">復習教材一覧</a>
    <a href="../../index.html" style="color:#2476c9; font-weight:700; text-decoration:none;">学習ポータルに戻る</a>
  </div>
</div>
<script src="../../assets/js/fe-study-sync.js"></script>
</body>
</html>
