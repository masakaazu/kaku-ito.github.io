<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>基本情報技術者試験｜インタラクティブ復習</title>
    <style>
      :root {
        --navy: #102a5c;
        --blue: #2563eb;
        --pale: #eff6ff;
        --ink: #172033;
        --muted: #64748b;
        --line: #dbe3ef;
        --bg: #f6f8fc;
        --card: #fff;
        --ok: #087a55;
        --bad: #c2410c;
        --warn: #9a4d00;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
        line-height: 1.65;
      }
      header {
        background: linear-gradient(120deg, #102a5c, #2563eb);
        color: #fff;
        padding: 28px 18px 22px;
      }
      header > div,
      main {
        max-width: 1050px;
        margin: auto;
      }
      h1 {
        font-size: clamp(1.45rem, 4vw, 2.2rem);
        margin: 0 0 5px;
        line-height: 1.3;
      }
      header p {
        margin: 0;
        opacity: 0.9;
        font-size: 0.95rem;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 18px;
      }
      .stat {
        background: #ffffff1c;
        border: 1px solid #ffffff38;
        border-radius: 12px;
        padding: 9px 12px;
      }
      .stat b {
        display: block;
        font-size: 1.35rem;
      }
      .stat span {
        font-size: 0.78rem;
      }
      main {
        padding: 18px;
      }
      .toolbar {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        margin: 4px 0 16px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 9px;
        padding: 9px 13px;
        font-weight: 700;
      }
      .primary {
        background: var(--blue);
        color: #fff;
      }
      .secondary {
        background: #e6eefc;
        color: #16429a;
      }
      .danger {
        background: #fff0ee;
        color: #b42318;
      }
      .toolbar button.active {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }
      .tabs {
        display: flex;
        overflow-x: auto;
        gap: 7px;
        padding: 1px 0 10px;
      }
      .tab {
        white-space: nowrap;
        background: #eaf0fa;
        color: #334155;
      }
      .tab.active {
        background: var(--navy);
        color: #fff;
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }
      .intro,
      .box,
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
        margin: 0 0 15px;
        box-shadow: 0 2px 8px #17203308;
      }
      h2 {
        font-size: 1.28rem;
        margin: 0 0 10px;
        color: var(--navy);
      }
      h3 {
        font-size: 1.06rem;
        margin: 0 0 7px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
        gap: 12px;
      }
      .flash {
        position: relative;
        text-align: left;
        min-height: 148px;
        padding: 15px;
        background: #fff;
        border: 1px solid #cbd9ee;
        border-radius: 12px;
        color: var(--ink);
      }
      .flash:hover {
        border-color: var(--blue);
        box-shadow: 0 3px 12px #2563eb22;
      }
      .flash .hint {
        font-size: 0.8rem;
        color: var(--muted);
        font-weight: 400;
      }
      .flash .back {
        display: none;
        margin-top: 10px;
        font-size: 0.91rem;
      }
      .flash.open .back {
        display: block;
      }
      .flash.open .hint {
        color: var(--blue);
      }
      .label {
        display: inline-block;
        border-radius: 99px;
        padding: 2px 8px;
        background: var(--pale);
        color: #1d4ed8;
        font-size: 0.75rem;
        margin-bottom: 7px;
      }
      .key {
        font-weight: 800;
        color: #1e3a8a;
      }
      .point {
        margin-top: 7px;
        padding-top: 7px;
        border-top: 1px dashed var(--line);
        font-size: 0.87rem;
      }
      .quizbox {
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 12px;
        margin: 12px 0;
        background: #fff;
      }
      .qmeta {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .question {
        font-weight: 750;
        margin: 5px 0 10px;
      }
      .choices {
        display: grid;
        gap: 7px;
      }
      .choice {
        text-align: left;
        border: 1px solid #cbd5e1;
        background: #fff;
        color: var(--ink);
        font-weight: 500;
      }
      .choice:hover:not(:disabled) {
        border-color: var(--blue);
        background: var(--pale);
      }
      .choice.correct {
        background: #ecfdf5;
        border-color: #34d399;
        color: #065f46;
      }
      .choice.wrong {
        background: #fff1f0;
        border-color: #fb7185;
        color: #9f1239;
      }
      .feedback {
        margin-top: 9px;
        padding: 9px 11px;
        border-radius: 8px;
        font-size: 0.9rem;
        display: none;
      }
      .feedback.show {
        display: block;
      }
      .feedback.ok {
        background: #ecfdf5;
        color: #065f46;
      }
      .feedback.ng {
        background: #fff1f0;
        color: #9f1239;
      }
      .formula {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        overflow: auto;
      }
      .tablewrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.9rem;
      }
      th,
      td {
        border: 1px solid var(--line);
        padding: 9px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #eff6ff;
      }
      .note {
        border-left: 4px solid #f59e0b;
        background: #fffbeb;
        padding: 10px 12px;
        border-radius: 7px;
        font-size: 0.9rem;
      }
      .hidden {
        display: none !important;
      }
      .empty {
        color: var(--muted);
        padding: 10px 0;
      }
      .todaybar {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .small {
        font-size: 0.86rem;
        color: var(--muted);
      }
      footer {
        text-align: center;
        color: var(--muted);
        font-size: 0.82rem;
        padding: 8px 0 25px;
      }
      @media (max-width: 600px) {
        main {
          padding: 12px;
        }
        header {
          padding: 22px 14px 18px;
        }
        .stats {
          gap: 6px;
        }
        .stat {
          padding: 8px;
        }
        .stat b {
          font-size: 1.15rem;
        }
        .box,
        section {
          padding: 14px;
        }
        .toolbar button {
          font-size: 0.88rem;
          padding: 8px 10px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>基本情報技術者試験｜毎日10分の復習</h1>
        <p>ノート内容を、用語カード・4択クイズ・苦手復習で定着させる教材</p>
        <div class="stats">
          <div class="stat"><b id="answered">0</b><span>解答数</span></div>
          <div class="stat"><b id="accuracy">—</b><span>正答率</span></div>
          <div class="stat">
            <b id="mastered">0</b><span>学習済み問題</span>
          </div>
        </div>
      </div>
    </header>
    <main>
      <div class="toolbar">
        <button class="primary" id="todayBtn">今日の10問を出題</button

      </div>
      <div class="tabs" id="tabs"></div>
      <div id="todayArea" class="box hidden"></div>
      <div id="content"></div>
      <footer>
        画面の進捗はこのブラウザに保存され、正答・誤答はログイン中にクラウドへ同期されます。
      </footer>
    </main>

        document.querySelector("#accuracy").textContent = state.total
          ? Math.round((state.correct / state.total) * 100) + "%"
          : "—";
        document.querySelector("#mastered").textContent = Object.keys(
          state.seen,
        ).length;
      }
      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (x) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[x],
        );
      }
      function renderTabs() {
        const el = document.querySelector("#tabs");
        el.innerHTML = Object.entries(data)
          .map(
            ([k, v], i) =>
              `<button class="tab ${i === 0 ? "active" : ""}" data-tab="${k}">${v.name}</button>`,
          )
          .join("");
        el.querySelectorAll(".tab").forEach(
          (b) =>
            (b.onclick = () => {
              el.querySelectorAll(".tab").forEach((x) =>
                x.classList.remove("active"),
              );
              b.classList.add("active");
              document
                .querySelectorAll(".panel")
                .forEach((x) => x.classList.remove("active"));
              document
                .querySelector("#p-" + b.dataset.tab)
                .classList.add("active");
            }),
        );
      }
      function cardHtml(c) {
        return `<button class="flash"><span class="label">用語カード</span><br><span class="key">${esc(c[0])}</span><div class="hint">タップして答え・解説を表示</div><div class="back"><strong>${esc(c[1])}</strong><br>${esc(c[2])}<div class="point"><b>混同注意：</b>${esc(c[3])}</div></div></button>`;
      }
      function qHtml(item, n) {
        const [text, opts, ans, ex] = item.q;
        return `<div class="quizbox" id="q-${item.id}"><div class="qmeta">問題 ${n} ｜ ${data[item.cat].name}</div><div class="question">${esc(text)}</div><div class="choices">${opts.map((o, i) => `<button class="choice" data-i="${i}">${"アイウエ"[i]}. ${esc(o)}</button>`).join("")}</div><div class="feedback"></div></div>`;
      }
      function renderContent() {
        let html = "";
        Object.entries(data).forEach(([k, v], idx) => {
          let qs = v.questions.map((q, i) => ({
            cat: k,
            i,
            q,
            id: k + "-" + i,
          }));
          if (mode === "weak")
            qs = qs.filter((x) => weakQuestionIds.has(x.id));
          html += `<div class="panel ${idx === 0 ? "active" : ""}" id="p-${k}"><section><h2>${v.name}｜用語カード</h2><p class="small">カードを押して、意味・ポイント・混同しやすい用語を確認します。</p><div class="cards">${v.cards.map(cardHtml).join("")}</div></section><section><h2>${v.name}｜4択クイズ</h2>${qs.length ? qs.map((x, i) => qHtml(x, i + 1)).join("") : '<p class="empty">この分野には、まだ苦手問題がありません。全問題を解いて判定してください。</p>'}</section></div>`;
        });
        document.querySelector("#content").innerHTML = html;
        bindInteractions();
      }
      function bindInteractions() {
        document
          .querySelectorAll(".flash")
          .forEach((b) => (b.onclick = () => b.classList.toggle("open")));
        document.querySelectorAll(".quizbox").forEach((box) => {
          box
            .querySelectorAll(".choice")
            .forEach((btn) => (btn.onclick = () => answer(box, btn)));
        });
      }
      function answer(box, btn) {
        if (box.dataset.done) return;
        box.dataset.done = "1";
        const id = box.id.slice(2);
        const item = allQs.find((x) => x.id === id);
        const ans = item.q[2],
          picked = +btn.dataset.i;
        const buttons = [...box.querySelectorAll(".choice")];
        buttons.forEach((b, i) => {
          b.disabled = true;
          if (i === ans) b.classList.add("correct");
        });
        const fb = box.querySelector(".feedback");
        state.total++;
        state.seen[id] = true;
        if (picked === ans) {
          state.correct++;
          delete state.wrong[id];
          fb.className = "feedback show ok";
          fb.innerHTML = "<b>正解！</b> " + esc(item.q[3]);
        } else {
          btn.classList.add("wrong");
          state.wrong[id] = (state.wrong[id] || 0) + 1;
          fb.className = "feedback show ng";
          fb.innerHTML = "<b>不正解。</b> " + esc(item.q[3]);
        }
        save();
        /* ここを追加：Supabaseへ正答・誤答を同期 */
        if (window.recordAnswer) {
          window.recordAnswer(
            "913no2-" + item.id,
            item.cat,
            picked === ans,
          );
        }
      }
      function renderToday() {
        const area = document.querySelector("#todayArea");
        if (!today.length) {
          area.classList.add("hidden");
          return;
        }
        area.classList.remove("hidden");
        area.innerHTML = `<div class="todaybar"><div><h2>今日の10問</h2><p class="small">ランダム出題です。解答状況は通常の進捗にも反映されます。</p></div><button class="secondary" id="closeToday">閉じる</button></div>${today.map((x, i) => qHtml(x, i + 1)).join("")}`;
        area.querySelector("#closeToday").onclick = () => {
          today = [];
          renderToday();
        };
        area
          .querySelectorAll(".quizbox")
          .forEach((box) =>
            box
              .querySelectorAll(".choice")
              .forEach((btn) => (btn.onclick = () => answer(box, btn))),
          );
      }
      document.querySelector("#todayBtn").onclick = () => {
        today = [...allQs]
          .sort(() => Math.random() - 0.5)
          .slice(0, Math.min(10, allQs.length));
        renderToday();
        document
          .querySelector("#todayArea")
          .scrollIntoView({ behavior: "smooth", block: "start" });
      };
      function getLocalWeakQuestionIds() {
        return Object.keys(state.wrong).filter(
          (id) => Number(state.wrong[id]) > 0,
        );
      }

      function normalizeCloudQuestionId(questionId) {
        const id = String(questionId || "");
        return id.startsWith("913no2-") ? id.slice("913no2-".length) : id;
      }

      async function getCloudAnswerStats() {
        for (let attempt = 0; attempt < 4; attempt++) {
          if (typeof window.getReviewAnswerStats === "function") {
            const rows = await window.getReviewAnswerStats();
            if (rows.length || attempt === 3) return rows;
          }
          await new Promise((resolve) => setTimeout(resolve, 250));
        }
        return [];
      }

      async function loadWeakQuestionIds() {
        const ids = new Set(getLocalWeakQuestionIds());

        try {
          const rows = await getCloudAnswerStats();
          rows.forEach((row) => {
            const id = normalizeCloudQuestionId(row.question_id);
            const exists = allQs.some((item) => item.id === id);
            const isWeak =
              typeof window.isWeakReviewQuestion === "function"
                ? window.isWeakReviewQuestion(row)
                : (row.wrong_count || 0) > (row.correct_count || 0);

            if (exists && isWeak) ids.add(id);
          });
        } catch (error) {
          console.error("苦手問題のクラウド読込に失敗しました", error);
        }

        return ids;
      }

      document.querySelector("#weakBtn").onclick = async function () {
        this.disabled = true;
        this.textContent = "苦手問題を読込中...";

        weakQuestionIds = await loadWeakQuestionIds();
        mode = "weak";
        renderContent();
        renderTabs();

        const firstWeak = allQs.find((item) =>
          weakQuestionIds.has(item.id),
        );

        if (firstWeak) {
          document
            .querySelector(`[data-tab="${firstWeak.cat}"]`)
            ?.click();
          this.textContent = `苦手問題だけ (${weakQuestionIds.size})`;
        } else {
          this.textContent = "苦手問題なし";
        }

        this.classList.add("active");
        document.querySelector("#allBtn").classList.remove("active");
        this.disabled = false;
      };

      document.querySelector("#allBtn").onclick = () => {
        mode = "all";
        renderContent();
        renderTabs();
        document.querySelector("#weakBtn").classList.remove("active");
        document.querySelector("#weakBtn").textContent = "苦手問題だけ";
        document.querySelector("#allBtn").classList.add("active");
      };
      document.querySelector("#resetBtn").onclick = async () => {
        const confirmed = confirm(
          "この端末の解答履歴・正答率・苦手問題をリセットします。\n" +
            "ログイン中は、クラウド側の正答数・誤答数も0に戻ります（履歴の行は削除されません）。\n" +
            "よろしいですか？",
        );

        if (!confirmed) return;

        const resetButton = document.querySelector("#resetBtn");
        state = { total: 0, correct: 0, seen: {}, wrong: {} };
        save();
        mode = "all";
        renderContent();
        renderTabs();

        if (window.resetReviewProgress) {
          resetButton.disabled = true;
          resetButton.textContent = "クラウドをリセット中...";

          const result = await window.resetReviewProgress();

          resetButton.disabled = false;
          resetButton.textContent = "進捗をリセット";

          if (!result.ok && result.reason === "error") {
            alert(
              "クラウド側のリセットに失敗しました。通信状態を確認して、もう一度お試しください。",
            );
          }
        }
      };
      renderTabs();
      renderContent();
      updateStats();
    </script>
