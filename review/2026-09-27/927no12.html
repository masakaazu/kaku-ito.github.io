<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>基本情報 復習教材｜DFD・モジュール・テスト・PMBOK・見積り</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#192332;--sub:#586579;--primary:#2563eb;--primary2:#dbeafe;--ok:#15803d;--ng:#b91c1c;--line:#dbe3ee;--warn:#9a3412}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.65} button{font:inherit;cursor:pointer} header{background:linear-gradient(135deg,#173b8f,#2563eb);color:#fff;padding:22px 16px 18px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #15295b55}.head-inner,main{max-width:960px;margin:auto}h1{font-size:clamp(1.25rem,4vw,1.8rem);margin:0 0 9px}.lead{margin:0;color:#e7efff;font-size:.92rem}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:#ffffff1d;border:1px solid #ffffff42;border-radius:10px;padding:8px;text-align:center}.stat b{display:block;font-size:1.2rem}.stat span{font-size:.74rem;color:#dfeaff}main{padding:18px 14px 45px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.btn{border:1px solid var(--primary);background:#fff;color:var(--primary);border-radius:9px;padding:8px 11px;font-weight:700}.btn.primary{background:var(--primary);color:#fff}.btn.danger{border-color:#dc2626;color:#b91c1c}.btn.active{background:#172554;color:#fff;border-color:#172554}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:7px;margin-bottom:12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#334155;border-radius:999px;padding:8px 12px}.tab.active{background:var(--primary);border-color:var(--primary);color:white}.panel{display:none}.panel.active{display:block}.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #1e293b0b}h2{font-size:1.2rem;margin:0 0 8px}h3{font-size:1rem;margin:18px 0 8px}.hint{color:var(--sub);font-size:.9rem;margin:0 0 8px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.flash{min-height:175px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:12px;text-align:left;padding:13px;transition:.18s}.flash:hover{transform:translateY(-2px);box-shadow:0 5px 15px #2563eb20}.flash .front{font-size:1.05rem;font-weight:800;color:#123b8b}.flash .prompt{font-size:.84rem;color:#64748b;margin-top:8px}.flash .back{display:none;margin-top:10px;border-top:1px dashed #93c5fd;padding-top:10px;font-size:.9rem}.flash.open .back{display:block}.tag{display:inline-block;background:#dbeafe;color:#174ea6;border-radius:999px;padding:1px 7px;font-size:.74rem;font-weight:700;margin-bottom:5px}dl{margin:0}dt{font-weight:800;margin-top:7px}dd{margin:0}.formula{background:#fff7ed;border-left:4px solid #f97316;padding:11px;border-radius:8px}.formula code{font-weight:800}.quiz{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.q{padding:12px 0;border-bottom:1px solid #edf1f6}.qtext{font-weight:800;margin-bottom:8px}.choices{display:grid;gap:7px}.choice{width:100%;text-align:left;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:9px}.choice:hover:not(:disabled){border-color:var(--primary);background:#eff6ff}.choice:disabled{cursor:default}.choice.correct{background:#dcfce7;border-color:#22c55e;color:#14532d}.choice.wrong{background:#fee2e2;border-color:#ef4444;color:#7f1d1d}.explain{display:none;margin:8px 0 2px;padding:9px;border-radius:8px;background:#f8fafc;font-size:.9rem}.explain.show{display:block}.notice{padding:12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12}.today-q{display:none}.today-q.active{display:block}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{border:1px solid var(--line);padding:8px;vertical-align:top}th{background:#eff6ff}.small{font-size:.84rem;color:var(--sub)}.empty{padding:15px;background:#f8fafc;border:1px dashed #94a3b8;border-radius:10px;color:#475569}.checkline{display:flex;align-items:center;gap:8px;margin:8px 0}.footer-note{color:#64748b;font-size:.8rem;margin-top:20px}@media(max-width:560px){main{padding:12px 10px 32px}.stats{gap:5px}.stat{padding:6px 3px}.stat b{font-size:1rem}.box{padding:13px}.cards{grid-template-columns:1fr}table{font-size:.8rem}.controls .btn{padding:7px 9px}}
</style>
</head>
<body>
<header><div class="head-inner"><h1>基本情報技術者試験｜復習教材</h1><p class="lead">DFD・モジュール設計・テスト・プロジェクトマネジメント・見積り／アローダイアグラム</p><div class="stats"><div class="stat"><b id="answered">0</b><span>解答数</span></div><div class="stat"><b id="rate">—</b><span>正答率</span></div><div class="stat"><b id="learned">0</b><span>学習済み問題数</span></div></div></div></header>
<main>
<div class="controls"><button class="btn primary" id="todayBtn">今日の10問</button><button class="btn" id="weakBtn">苦手問題</button><button class="btn danger" id="resetBtn">進捗をリセット</button></div>
<div class="tabs" id="tabs"></div>
<section class="panel" id="todayPanel"><div class="box"><h2>今日の10問</h2><p class="hint">全問題からランダムに最大10問を出題します。選択肢を押すとその場で解説が出ます。</p><div id="todayQuiz"></div></div></section>
<section class="panel" id="weakPanel"><div class="box"><h2>苦手問題</h2><p class="hint">過去に間違えた問題だけを再出題します。正解しても、履歴は残して復習対象にできます。</p><div id="weakQuiz"></div></div></section>
<div id="content"></div>
<p class="footer-note">学習履歴はこのブラウザの localStorage に保存されます。外部ライブラリ・通信は使用していません。</p>
</main>
<script>
const data=[
{key:'design',name:'設計・モジュール',cards:[
['DFD（データフローダイアグラム）','システム内でデータがどこから来て、どこへ流れ、どの処理・データストアを通るかを表す図。','データの流れを表す。処理の手順や時間順ではない。','アローダイアグラムは作業の順序・日程を表す点が異なる。'],
['モジュール','システムや機器を構成する機能・要素の部品。','機能ごとに分割して、モジュール単位で開発・テストする。','クラスはオブジェクト指向での設計単位。モジュールはより広い一般的な部品の概念。'],
['モジュール結合度','あるモジュールが他のモジュールにどれほど依存しているかの強さ。','結合度は低いほどよい。変更の影響が他へ広がりにくく、保守しやすい。','凝集度とは逆に、モジュール間の関係を見る尺度。'],
['モジュール凝集度','一つのモジュールの内部にある機能同士の関連の強さ。','凝集度は高いほどよい。役割がまとまり、理解・修正がしやすい。','結合度はモジュール間、凝集度はモジュール内を見る。']
],questions:[
['d1','DFDが主に表現するものはどれか。',['プログラムの実行速度','システムにおけるデータの流れ','作業者の組織構造','ネットワーク機器の配置'],1,'DFDは、外部実体・処理・データストアなどの間を流れるデータに着目する図である。'],
['d2','保守性を高めるモジュールの組合せとして適切なものはどれか。',['結合度が高く、凝集度が低い','結合度が低く、凝集度が高い','結合度が高く、凝集度が高い','結合度が低く、凝集度が低い'],1,'モジュール間の依存は少ない（低結合）ほど、内部の役割のまとまりは強い（高凝集）ほどよい。'],
['d3','「モジュール結合度」の説明として適切なものはどれか。',['モジュール内部の機能の関連の強さ','モジュール間の関連・依存の強さ','テストケースの網羅性','データベース表の正規化の度合い'],1,'結合度はモジュール間の関係の強さを表す。低結合にすると変更の波及を抑えられる。']
]},
{key:'test',name:'テスト',cards:[
['結合テスト','複数のモジュールを組み合わせ、モジュール間のインタフェースや連携を確認するテスト。','単体テストの後に行い、データの受渡しや呼出し関係を重点的に確認する。','システムテストは、完成したシステム全体が要件を満たすかを確認する。'],
['トップダウンテスト','上位モジュールから順に結合していく方式。未完成の下位モジュールはスタブで代用する。','スタブは「呼び出される仮の下位モジュール」。','ドライバを使うのはボトムアップテスト。'],
['ボトムアップテスト','下位モジュールから順に結合していく方式。未完成の上位モジュールはドライバで代用する。','ドライバは「テスト対象を呼び出す仮の上位モジュール」。','スタブを使うのはトップダウンテスト。'],
['リグレッションテスト（回帰テスト）','修正・変更後に、変更箇所以外も含めて不具合が新たに起きていないか確認するテスト。','バグ修正後や機能追加後に既存機能への悪影響を調べる。','再テストは修正した不具合が直ったことを確認すること。回帰テストは影響範囲をより広く確認する。']
],questions:[
['t1','トップダウンテストで、未完成の下位モジュールの代わりに用いるものはどれか。',['スタブ','ドライバ','デバッガ','コンパイラ'],0,'トップダウンでは上位から呼び出すため、呼び出される下位モジュールの代役であるスタブを用いる。'],
['t2','ボトムアップテストで、未完成の上位モジュールの代わりに用いるものはどれか。',['スタブ','ドライバ','ダミーデータベース','テスト仕様書'],1,'ボトムアップでは下位モジュールを動かすために、それを呼び出す仮の上位モジュールであるドライバを使う。'],
['t3','リグレッションテストの目的として最も適切なものはどれか。',['修正した箇所だけが直ったことを確認する','変更により別の部分に不具合が発生していないか確認する','利用者に操作方法を教育する','性能目標を設定する'],1,'回帰テストは変更に伴う既存機能への悪影響の有無を確認する。'],
['t4','結合テストで重点的に確認する対象として適切なものはどれか。',['モジュール内部の命令単位の動作','モジュール間のデータ受渡し・呼出し関係','利用者の満足度','ソースコードの命名規則'],1,'結合テストは、単体テスト済みのモジュールを組み合わせ、連携が正しいかを確認する。']
]},
{key:'pm',name:'PMBOK・管理',cards:[
['フィージビリティスタディ','新しいプロジェクトなどの計画について、実現可能性を調査・検証すること。','技術面・コスト面・運用面などから「実現できるか」を判断する。','要件定義は、実現すると決めた後に必要な機能・条件を明確化する工程。'],
['PMBOK','プロジェクトマネジメントに関する知識を体系的にまとめたもの。','ノートの整理では10の知識エリアとして覚える。','開発手法そのものではなく、プロジェクトを管理するための知識体系。'],
['スコープ管理','プロジェクトの作業範囲と成果物を定義・管理すること。','「何を作るか／作らないか」を明確にし、範囲の無秩序な拡大を防ぐ。','品質管理は成果物の品質、スケジュール管理は日程を対象にする。'],
['ステークホルダー管理','プロジェクトに関係する人・組織を把握し、期待や関係を管理すること。','顧客、利用者、スポンサー、チームなどとの関係を扱う。','コミュニケーション管理は情報のやり取りを扱い、ステークホルダー管理は関係者そのものを扱う。']
],questions:[
['p1','フィージビリティスタディの説明として適切なものはどれか。',['実現可能性を調査・検証すること','障害原因を究明すること','成果物をテストすること','契約書を保管すること'],0,'フィージビリティスタディは、計画の技術的・経済的などの実現可能性を調べる活動である。'],
['p2','プロジェクトの作業範囲と成果物を定義・管理する知識エリアはどれか。',['コスト管理','スコープ管理','リスク管理','調達管理'],1,'スコープ管理は、プロジェクトで実施する作業と成果物の範囲を管理する。'],
['p3','プロジェクトに必要なサービスや製品の調達、契約を管理するのはどれか。',['品質管理','資源管理','調達管理','コミュニケーション管理'],2,'調達管理は外部から必要な製品・サービスを入手するための調達・契約を扱う。'],
['p4','チームメンバやステークホルダー間の情報交換を管理するのはどれか。',['コミュニケーション管理','スケジュール管理','統合管理','リスク管理'],0,'コミュニケーション管理は、必要な情報を適切な相手に適切な時点・方法で伝えることを扱う。'],
['p5','発生する可能性があり、プロジェクトへ影響を与える不確実な事象を管理するのはどれか。',['品質管理','リスク管理','資源管理','スコープ管理'],1,'リスク管理は、発生し得るリスクを特定・分析し、対応策を計画・実施する。']
]},
{key:'estimate',name:'見積り・日程',cards:[
['ファンクションポイント法','画面数などの機能量を基準に、機能の難易度を見積もる手法。','言語や開発者の個人差より、利用者から見た機能量に着目する。','COCOMOは主にプログラム規模などを基に工数を見積もるモデル。'],
['アローダイアグラム','作業の順序や所要時間を矢印で表し、プロジェクトの流れを図示する手法。','先行作業・後続作業の依存関係を表し、最早／最遅時刻やクリティカルパスを求める。','DFDはデータの流れ、アローダイアグラムは作業の流れ。'],
['最早結合点時刻','その結合点から、最も早く後続作業を開始できる時刻。','先行する全作業が終わる必要があるため、複数の到着時刻の最大値を取る。','最遅結合点時刻は、工期を遅らせずにその結合点へ到達してよい最も遅い時刻。'],
['最遅結合点時刻','工期を遅らせない範囲で、その結合点に到達できる最も遅い時刻。','後続作業から逆向きに計算し、候補の最小値を取る。','最早結合点時刻とは計算方向・意味が逆。'],
['クリティカルパス','開始から終了までの経路のうち、作業日数の合計が最も長く、余裕時間がない経路。','この経路上の作業が遅れると、プロジェクト全体の完了も遅れる。','単に作業数が多い経路ではなく、所要時間の合計が最長の経路。']
],questions:[
['e1','画面数などの機能量を基準に、ソフトウェア開発規模を見積もる手法はどれか。',['ファンクションポイント法','PERT図','散布図','デシジョンテーブル'],0,'ファンクションポイント法は、入出力・照会・ファイル・インタフェースなどの機能量から規模を見積もる。'],
['e2','アローダイアグラムで、最早結合点時刻を求めるときの考え方として適切なものはどれか。',['先行作業の終了時刻の最小値を取る','先行作業の終了時刻の最大値を取る','後続作業の開始時刻の最大値を取る','全作業時間を平均する'],1,'結合点から後続作業を開始するには、すべての先行作業が終わる必要があるため最大値を取る。'],
['e3','アローダイアグラムで、最遅結合点時刻を逆方向に求めるときの考え方として適切なものはどれか。',['後続から得られる候補時刻の最小値を取る','後続から得られる候補時刻の最大値を取る','先行作業時間を加算する','最早時刻と常に同じにする'],0,'工期を遅らせないためには、複数の後続作業の条件をすべて満たす必要がある。そのため最小値を取る。'],
['e4','クリティカルパスの説明として適切なものはどれか。',['費用が最も高い作業の経路','作業数が最も多い経路','作業日数の合計が最も長く、余裕がない経路','最初に開始する作業だけの経路'],2,'クリティカルパスは全体工期を決める最長経路であり、余裕時間が0である。'],
['e5','次の作業ネットワークを考える。開始→A(2日)→終了、開始→B(1日)→C(3日)→終了。クリティカルパスはどれか。',['A','B→C','AとB→Cの両方','判定できない'],1,'A経路は2日、B→C経路は1+3=4日。最も長いB→Cがクリティカルパスで、全体工期は4日となる。']
]}
];
const allQ=data.flatMap(x=>x.questions.map(q=>({...q,section:x.name,key:x.key})));
const storageKey='fe_note_review_v1';let state=JSON.parse(localStorage.getItem(storageKey)||'{"answers":{},"opened":{}}');
function save(){localStorage.setItem(storageKey,JSON.stringify(state));renderStats()}
function esc(s){return s.replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderStats(){const ans=Object.values(state.answers);document.querySelector('#answered').textContent=ans.length;document.querySelector('#rate').textContent=ans.length?Math.round(ans.filter(a=>a.correct).length/ans.length*100)+'%':'—';document.querySelector('#learned').textContent=new Set(ans.map(a=>a.id)).size}
function cardHtml(card,i,section){const id=section+'c'+i,open=state.opened[id];return `<button class="flash ${open?'open':''}" data-card="${id}"><span class="tag">用語カード</span><div class="front">${esc(card[0])}</div><div class="prompt">タップして答え・解説を見る</div><div class="back"><dl><dt>一言でいうと</dt><dd>${esc(card[1])}</dd><dt>試験で問われやすいポイント</dt><dd>${esc(card[2])}</dd><dt>混同しやすい用語との違い</dt><dd>${esc(card[3])}</dd></dl></div></button>`}
function qHtml(q){const prev=state.answers[q[0]];return `<div class="q" data-q="${q[0]}"><div class="qtext">${esc(q[1])}</div><div class="choices">${q[2].map((c,i)=>{let cl='choice';if(prev){if(i===q[3])cl+=' correct';else if(i===prev.choice&&!prev.correct)cl+=' wrong'}return `<button class="${cl}" ${prev?'disabled':''} data-choice="${i}">${String.fromCharCode(65+i)}. ${esc(c)}</button>`}).join('')}</div><div class="explain ${prev?'show':''}">${prev?(prev.correct?'✅ 正解。':'❌ 不正解。')+' '+esc(q[4]):''}</div></div>`}
function renderMain(){const tabs=document.querySelector('#tabs'),content=document.querySelector('#content');tabs.innerHTML=data.map((s,i)=>`<button class="tab ${i===0?'active':''}" data-target="${s.key}">${s.name}</button>`).join('');content.innerHTML=data.map((s,i)=>`<section class="panel ${i===0?'active':''}" id="${s.key}"><div class="box"><h2>${s.name}</h2><p class="hint">用語カードを開いてから、4択クイズで確認しましょう。</p><div class="cards">${s.cards.map((c,j)=>cardHtml(c,j,s.key)).join('')}</div></div>${s.key==='estimate'?`<div class="box"><h3>アローダイアグラム計算のミニ例題</h3><div class="formula"><code>開始 → A（2日）→ 終了</code><br><code>開始 → B（1日）→ C（3日）→ 終了</code><br>経路Aは 2日、経路B→Cは \(1+3=4\) 日。よって全体工期は4日で、クリティカルパスは B→C。<br><span class="small">最早結合点時刻：先行作業の終了時刻の最大値。最遅結合点時刻：後続側から逆算した候補の最小値。</span></div></div>`:''}<div class="box"><h3>確認クイズ（${s.questions.length}問）</h3><div class="quiz">${s.questions.map(qHtml).join('')}</div></div></section>`).join('');bindEvents()}
function bindEvents(){document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{state.opened[b.dataset.card]=!state.opened[b.dataset.card];save();b.classList.toggle('open')});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(b.closest('.q').dataset.q,+b.dataset.choice));document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showPanel(t.dataset.target,t));}
function answer(id,choice){const q=allQ.find(x=>x[0]===id);if(state.answers[id])return;const correct=choice===q[3];state.answers[id]={id,choice,correct,at:Date.now()};save();if(window.recordAnswer)window.recordAnswer(`927no12-${id}`,q[0],correct);document.querySelectorAll(`[data-q="${id}"]`).forEach(el=>{el.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;const n=+b.dataset.choice;if(n===q[3])b.classList.add('correct');else if(n===choice&&!correct)b.classList.add('wrong')});let e=el.querySelector('.explain');e.classList.add('show');e.textContent=(correct?'✅ 正解。':'❌ 不正解。')+' '+q[4]});}
function showPanel(id,tab){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.target===id));document.querySelectorAll('.controls .btn').forEach(b=>b.classList.remove('active'));if(tab)tab.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function specialQuiz(target,questions,empty){const area=document.querySelector(target);if(!questions.length){area.innerHTML=`<div class="empty">${empty}</div>`;return}area.innerHTML=questions.map(q=>qHtml(q)).join('');area.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(b.closest('.q').dataset.q,+b.dataset.choice));}
document.querySelector('#todayBtn').onclick=function(){const picked=[...allQ].sort(()=>Math.random()-.5).slice(0,10);specialQuiz('#todayQuiz',picked,'問題がありません。');showPanel('todayPanel',this)};
document.querySelector('#weakBtn').onclick=function(){const weak=allQ.filter(q=>state.answers[q[0]]&&!state.answers[q[0]].correct);specialQuiz('#weakQuiz',weak,'まだ間違えた問題はありません。まず各分野のクイズ、または「今日の10問」に挑戦しましょう。');showPanel('weakPanel',this)};
document.querySelector('#resetBtn').onclick=function(){if(confirm('解答履歴・用語カードの開閉状態をすべて消去します。よろしいですか？')){state={answers:{},opened:{}};save();renderMain();showPanel(data[0].key);}};
renderMain();renderStats();
</script>
