<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>基本情報 復習教材｜法規・標準化・NoSQL・SDN</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #fff;
        --ink: #172033;
        --muted: #65708a;
        --line: #dce3f0;
        --accent: #315efb;
        --good: #138a5b;
        --bad: #cf3c3c;
        --warn: #a86b00;
        --shadow: 0 8px 22px rgba(22, 36, 70, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic",
          Meiryo, sans-serif;
        line-height: 1.65;
      }
      button {
        font: inherit;
      }
      header {
        background: linear-gradient(125deg, #172b67, #315efb);
        color: #fff;
        padding: 24px 16px 20px;
      }
      .wrap {
        max-width: 980px;
        margin: auto;
      }
      h1 {
        font-size: 1.45rem;
        line-height: 1.35;
        margin: 0 0 5px;
      }
      .sub {
        margin: 0;
        opacity: 0.9;
        font-size: 0.92rem;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
        margin-top: 17px;
      }
      .stat {
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 12px;
        padding: 10px;
        text-align: center;
      }
      .stat b {
        display: block;
        font-size: 1.3rem;
      }
      .stat span {
        font-size: 0.77rem;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 16px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        overflow: auto;
        padding: 2px 0 12px;
      }
      .tab {
        flex: 0 0 auto;
        border: 1px solid #cfd8ea;
        background: #fff;
        color: #32415e;
        border-radius: 999px;
        padding: 8px 13px;
        cursor: pointer;
      }
      .tab.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }
      .card {
        background: var(--card);
        box-shadow: var(--shadow);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 17px;
        margin-bottom: 15px;
      }
      h2 {
        font-size: 1.18rem;
        margin: 0 0 10px;
      }
      h3 {
        font-size: 1rem;
        margin: 20px 0 8px;
      }
      .note {
        font-size: 0.9rem;
        color: var(--muted);
        margin: 0;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0 16px;
      }
      .action {
        border: 0;
        background: var(--accent);
        color: #fff;
        border-radius: 9px;
        padding: 9px 12px;
        cursor: pointer;
      }
      .action.subtle {
        background: #e9eefc;
        color: #244abf;
      }
      .action.danger {
        background: #fff0f0;
        color: #ae2222;
        border: 1px solid #f3b8b8;
      }
      .flash {
        border: 1px solid #cbd6ff;
        background: #f3f6ff;
        border-radius: 10px;
        padding: 13px;
        margin: 12px 0;
      }
      .flash .answer {
        display: none;
        margin-top: 9px;
        border-top: 1px solid #d6e0ff;
        padding-top: 9px;
      }
      .flash.open .answer {
        display: block;
      }
      .term {
        border-top: 1px solid var(--line);
        padding: 12px 0;
      }
      .term:first-of-type {
        border-top: 0;
      }
      .term button {
        width: 100%;
        border: 0;
        background: #f4f6fa;
        border-radius: 9px;
        padding: 10px;
        text-align: left;
        cursor: pointer;
        color: var(--ink);
        font-weight: 700;
      }
      .term .detail {
        display: none;
        padding: 10px 5px 0;
      }
      .term.open .detail {
        display: block;
      }
      .detail p {
        margin: 6px 0;
        font-size: 0.92rem;
      }
      .label {
        font-weight: 700;
        color: #284db7;
      }
      .quiz-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .badge {
        font-size: 0.8rem;
        border-radius: 999px;
        background: #edf1fa;
        color: #41506b;
        padding: 4px 8px;
      }
      .question {
        font-weight: 700;
        margin: 12px 0;
      }
      .choices {
        display: grid;
        gap: 8px;
      }
      .choice {
        background: #fff;
        border: 1px solid #cfd8ea;
        border-radius: 9px;
        padding: 10px;
        text-align: left;
        cursor: pointer;
        color: var(--ink);
      }
      .choice:hover {
        border-color: var(--accent);
      }
      .choice:disabled {
        cursor: default;
      }
      .choice.correct {
        border-color: var(--good);
        background: #ecfbf4;
      }
      .choice.wrong {
        border-color: var(--bad);
        background: #fff0f0;
      }
      .feedback {
        margin-top: 10px;
        padding: 10px;
        border-radius: 9px;
        font-size: 0.92rem;
        display: none;
      }
      .feedback.show {
        display: block;
      }
      .feedback.good {
        background: #eafaf3;
        color: #075c39;
      }
      .feedback.bad {
        background: #fff0f0;
        color: #912222;
      }
      .empty {
        color: var(--muted);
        padding: 14px 0;
      }
      .compare {
        overflow: auto;
      }
      .compare table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      .compare th,
      .compare td {
        border: 1px solid var(--line);
        padding: 8px;
        vertical-align: top;
      }
      .compare th {
        background: #eef2fb;
        text-align: left;
      }
      .foot {
        font-size: 0.8rem;
        color: var(--muted);
        margin: 20px 0 8px;
      }
      .hidden {
        display: none !important;
      }
      @media (max-width: 560px) {
        header {
          padding: 19px 14px;
        }
        .stats {
          gap: 6px;
        }
        .stat {
          padding: 8px 4px;
        }
        .stat b {
          font-size: 1.12rem;
        }
        .stat span {
          font-size: 0.69rem;
        }
        main {
          padding: 12px;
        }
        .card {
          padding: 14px;
        }
        .choice {
          padding: 11px;
        }
        .compare table {
          min-width: 620px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>基本情報技術者｜復習教材</h1>
        <p class="sub">
          セキュリティ関連法規・労働関連法規・標準化・NoSQL・MACアドレス・OpenFlow／SDN
        </p>
        <div class="stats">
          <div class="stat"><b id="answered">0</b><span>解答数</span></div>
          <div class="stat"><b id="rate">—</b><span>正答率</span></div>
          <div class="stat">
            <b id="learned">0</b><span>学習済み問題数</span>
          </div>
        </div>
      </div>
    </header>
    <main>
      <div class="toolbar">
        <button class="action" id="todayBtn">今日の10問</button
        ><button class="action subtle" id="weakBtn">苦手問題だけ</button
        ><button class="action subtle" id="allBtn">全問題を表示</button
        ><button class="action danger" id="resetBtn">進捗をリセット</button>
      </div>
      <div class="tabs" id="tabs"></div>
      <section id="panels"></section>
      <p class="foot">
        この教材は添付ノートを優先して整理しています。内容の正確性確認が必要な箇所は「要確認」と明記しました。
      </p>
    </main>

        [
          "dbnet",
          "MACアドレスの先頭24ビットに該当するものは？",
          ["IPアドレス", "OUI", "ポート番号", "サブネットマスク"],
          1,
          "OUIはMACアドレス先頭24ビットのベンダ識別子である。",
        ],
        [
          "dbnet",
          "SDNにおいてネットワーク全体を見て制御を行うものは？",
          ["スイッチ", "NIC", "コントローラ", "ルータのMACアドレス"],
          2,
          "SDNではコントローラが制御を担当し、スイッチがパケット転送を担当する。",
        ],
        [
          "dbnet",
          "OpenFlowの説明として最も適切なものは？",
          [
            "RDBの問合せ言語",
            "コントローラがスイッチの転送動作を制御するためのプロトコル",
            "MACアドレスを割り当てる規格",
            "JSONを格納するNoSQL",
          ],
          1,
          "OpenFlowはSDNでコントローラとスイッチの連携に用いられる代表的なプロトコル。",
        ],
        [
          "dbnet",
          "MACアドレスとIPアドレスの説明として正しいものは？",
          [
            "MACは論理アドレス、IPは物理アドレス",
            "MACはNICなどに割り当てられる物理アドレス、IPは論理アドレス",
            "両方とも先頭24ビットがOUI",
            "両方ともベンダが必ず割り当てる",
          ],
          1,
          "MACアドレスはデータリンク層で用いられる物理アドレス、IPアドレスはネットワーク層の論理アドレス。",
        ],
      ];
      const storage = "feReview_v1";
      let state = JSON.parse(
        localStorage.getItem(storage) ||
          '{"answers":0,"correct":0,"seen":[],"wrong":[]}',
      );
      let mode = "all";
      let active = "laws";
      function save() {
        localStorage.setItem(storage, JSON.stringify(state));
        stats();
      }
      function stats() {
        document.querySelector("#answered").textContent = state.answers;
        document.querySelector("#rate").textContent = state.answers
          ? Math.round((state.correct / state.answers) * 100) + "%"
          : "—";
        document.querySelector("#learned").textContent = state.seen.length;
      }
      function esc(s) {
        return s.replace(
          /[&<>]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
        );
      }
      function render() {
        const tabs = document.querySelector("#tabs"),
          panels = document.querySelector("#panels");
        tabs.innerHTML = data
          .map(
            (x) =>
              `<button class="tab ${x.key === active ? "active" : ""}" data-tab="${x.key}">${x.name}</button>`,
          )
          .join("");
        panels.innerHTML = data
          .map(
            (x) =>
              `<section class="panel ${x.key === active ? "active" : ""}" id="p-${x.key}"><div class="card"><h2>${x.name}</h2><p class="note">${x.summary}</p><div class="flash" id="flash-${x.key}"><b>30秒チェック：</b> ${x.key === "laws" ? "派遣と請負の最大の違いは「誰が指揮命令するか」。" : x.key === "standards" ? "IETF＝インターネット技術、RFC＝技術文書。" : "SDNは制御（コントローラ）と転送（スイッチ）を分離。"}<div class="answer">答え：${x.key === "laws" ? "派遣先が指揮命令するのが派遣。請負は請負側が管理し成果物完成に責任を持つ。" : x.key === "standards" ? "IEEEはLAN、IETFはインターネット、ISOは国際、JISは日本。" : "MAC先頭24ビットはOUI。OpenFlowはコントローラがスイッチを制御する仕組み。"}</div><button class="action subtle reveal" style="margin-top:9px">答えを見る</button></div><h3>用語カード（タップで展開）</h3>${x.terms.map((t) => `<div class="term"><button>${t[0]} <span style="float:right">＋</span></button><div class="detail"><p><span class="label">一言でいうと：</span>${t[1]}</p><p><span class="label">試験で問われやすいポイント：</span>${t[2]}</p><p><span class="label">混同しやすい用語との違い：</span>${t[3]}</p></div></div>`).join("")}</div><div class="card"><h3>比較表</h3><div class="compare"><table>${x.compare.map((r, i) => `<tr>${r.map((c) => (i ? `<td>${c}</td>` : `<th>${c}</th>`)).join("")}</tr>`).join("")}</table></div></div><div class="card"><div class="quiz-head"><h2>4択クイズ</h2><span class="badge" id="count-${x.key}"></span></div><div id="quiz-${x.key}"></div></div></section>`,
          )
          .join("");
        document.querySelectorAll(".tab").forEach(
          (b) =>
            (b.onclick = () => {
              active = b.dataset.tab;
              render();
            }),
        );
        document
          .querySelectorAll(".term button")
          .forEach(
            (b) => (b.onclick = () => b.parentElement.classList.toggle("open")),
          );
        document
          .querySelectorAll(".reveal")
          .forEach(
            (b) => (b.onclick = () => b.parentElement.classList.add("open")),
          );
        data.forEach((x) => renderQuiz(x.key));
      }
      function selected() {
        let q = questions.filter((x) =>
          mode === "today"
            ? todaySet.includes(x)
            : mode === "weak"
              ? state.wrong.includes(questions.indexOf(x))
              : true,
        );
        return q;
      }
      let todaySet = [];
      function makeToday() {
        let shuffled = [...questions].sort(() => Math.random() - 0.5);
        todaySet = shuffled.slice(0, Math.min(10, questions.length));
        mode = "today";
        active = "laws";
        render();
      }
      function renderQuiz(key) {
        let qs = selected().filter((q) => q[0] === key),
          box = document.querySelector("#quiz-" + key);
        document.querySelector("#count-" + key).textContent =
          qs.length + "問表示";
        if (!qs.length) {
          box.innerHTML =
            '<p class="empty">この分野に表示する問題はありません。苦手問題を増やすには通常モードで解答してください。</p>';
          return;
        }
        box.innerHTML = qs
          .map((q) => {
            let i = questions.indexOf(q);
            return `<div class="q" data-i="${i}"><p class="question">Q. ${q[1]}</p><div class="choices">${q[2].map((c, j) => `<button class="choice" data-choice="${j}">${String.fromCharCode(65 + j)}. ${c}</button>`).join("")}</div><div class="feedback"></div></div>`;
          })
          .join(
            '<hr style="border:0;border-top:1px solid var(--line);margin:17px 0">',
          );
        box
          .querySelectorAll(".q")
          .forEach((el) =>
            el
              .querySelectorAll(".choice")
              .forEach(
                (b) => (b.onclick = () => answer(el, +b.dataset.choice)),
              ),
          );
      }
      function answer(el, choice) {
        if (el.dataset.done) return;
        el.dataset.done = "1";
        let i = +el.dataset.i,
          q = questions[i],
          ok = choice === q[3];
        state.answers++;
        state.correct += ok ? 1 : 0;
        if (!state.seen.includes(i)) state.seen.push(i);
        if (ok) {
          state.wrong = state.wrong.filter((x) => x !== i);
        } else if (!state.wrong.includes(i)) state.wrong.push(i);
        el.querySelectorAll(".choice").forEach((b) => {
          b.disabled = true;
          let n = +b.dataset.choice;
          if (n === q[3]) b.classList.add("correct");
          if (n === choice && !ok) b.classList.add("wrong");
        });
        let fb = el.querySelector(".feedback");
        fb.className = "feedback show " + (ok ? "good" : "bad");
        fb.innerHTML = (ok ? "正解！ " : "不正解。 ") + q[4];
        save();
      }
      document.querySelector("#todayBtn").onclick = makeToday;
      document.querySelector("#weakBtn").onclick = () => {
        mode = "weak";
        render();
      };
      document.querySelector("#allBtn").onclick = () => {
        mode = "all";
        render();
      };
      document.querySelector("#resetBtn").onclick = () => {
        if (confirm("解答履歴・正答率・苦手問題をすべて削除しますか？")) {
          state = { answers: 0, correct: 0, seen: [], wrong: [] };
          save();
          render();
        }
      };
      stats();
      render();
    </script>
    <div style="padding: 18px 0 24px; text-align: center;"><div style="display:flex; flex-wrap:wrap; justify-content:center; gap:45px;"><a href="index.html" style="color:#2476c9; font-weight:700; text-decoration:none;">← 目次に戻る</a><a href="../index.html" style="color:#2476c9; font-weight:700; text-decoration:none;">復習教材一覧</a><a href="../../index.html" style="color:#2476c9; font-weight:700; text-decoration:none;">学習ポータルに戻る</a></div></div>
