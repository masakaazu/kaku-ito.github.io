<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7ee">
  <title>午後（科目B）の演習｜応用情報技術者試験</title>
  <link rel="stylesheet" href="../../assets/css/site.css">
  <link rel="stylesheet" href="../../assets/css/pm.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
</head>

<body>
  <!-- 中身は pm.js が作る。作った問は catalog.js の materials に type: "pm" で1行足すと表に出る -->
  <main class="pm-index" data-pm-index data-topic="ap">
    <header class="hero">
      <span class="hero-label">午後</span>
      <h1>午後（科目B）の演習</h1>
      <p>150分・記述式。問1 情報セキュリティは必須、問2〜11 から4問を選ぶ。1問30分が目安。</p>
    </header>

    <section class="section">
      <div class="section-title">
        <h2>私の4問</h2>
        <span>問2〜11 から選ぶ</span>
      </div>
      <p class="legend">本番は当日に問題を見て選ぶので、練習は5〜6分野まで。札の右下は、対応する午前の分野の正答率（温室と同じ数字）。</p>
      <div data-pm-mine></div>
    </section>

    <section class="section">
      <div class="section-title">
        <h2>過去問の表</h2>
        <span>回 × 問（新しい順）</span>
      </div>
      <p class="legend">作ってある問はリンク。薄い字は題材だけ（まだ作っていない問）。</p>
      <div data-pm-grid></div>
    </section>

    <section class="section">
      <div class="section-title">
        <h2>見直す設問</h2>
        <span>△・× のまま／そろそろ忘れるころ</span>
      </div>
      <div data-pm-review></div>
    </section>

    <footer>資格学習支援サイト｜応用情報技術者試験 午後の演習</footer>
  </main>

  <script src="../../assets/js/study-sync.js" data-quiet></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/pm.js"></script>
  <script src="../../assets/js/site.js"></script>
</body>
</html>
