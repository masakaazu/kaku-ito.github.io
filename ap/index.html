<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e1f21">
  <title>応用情報技術者試験｜資格学習支援サイト</title>
  <link rel="stylesheet" href="../assets/css/site.css">
</head>

<body>
  <main>
    <header class="hero">
      <span class="hero-label">AP｜資格トピック</span>
      <h1>応用情報技術者試験</h1>
      <p>いま学習中の資格。昼休みノートで、仕組み・出題・実務とのつながりを理解する。</p>

      <div class="hero-meta">
        <span data-site-text="ap-status">学習中</span>
        <span>試験日：<span data-site-text="ap-exam">未定</span></span>
        <span>知識ストック：<span data-site-text="ap-notes-count">15件</span></span>
      </div>
    </header>

    <section class="section">
      <div class="section-title">
        <h2>計画と教材</h2>
      </div>

      <div class="grid">
        <a class="card" href="./notes/index.html">
          <span class="card-icon">NOTE</span>
          <h3>知識ストック</h3>
          <p>応用情報のテーマ別ノートを番号順に読み、前後のノートへ移動できる。</p>
          <span class="arrow">知識ストックを開く →</span>
        </a>

        <div class="card is-soon">
          <div class="card-head">
            <span class="card-icon">WBS</span>
            <span class="status status-soon">準備中</span>
          </div>
          <h3>学習WBS・カレンダー</h3>
          <p>試験日と学習時間が決まったら作成する。</p>
          <span class="arrow">準備中</span>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-title">
        <h2>最近のノート</h2>
        <a href="./notes/index.html">すべて見る →</a>
      </div>

      <div data-site-list="ap-notes-latest"></div>
    </section>

    <section class="section">
      <div class="section-title">
        <h2>あわせて使う共通教材</h2>
      </div>

      <div data-site-list="common"></div>
    </section>

    <footer>資格学習支援サイト｜応用情報技術者試験</footer>
  </main>

  <script src="../assets/js/catalog.js"></script>
  <script src="../assets/js/site.js"></script>
</body>
</html>
