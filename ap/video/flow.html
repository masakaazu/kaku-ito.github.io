<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>スライドの読み流し動画｜応用情報技術者試験</title>
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .flow-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
    .flow-tabs button {
      font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--theme-line); background: var(--theme-bg-alt); color: var(--theme-text);
    }
    .flow-tabs button[aria-pressed="true"] { background: var(--theme-accent); border-color: var(--theme-accent); color: var(--theme-on-accent); }
    .flow-video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; }
    .flow-now { margin: 10px 0 0; color: var(--theme-muted); font-size: 14px; }
    .flow-now strong { color: var(--theme-heading); }
    .flow-fields { list-style: none; padding: 0; margin: 16px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
    .flow-fields button {
      width: 100%; text-align: left; font: inherit; font-size: 14px; padding: 8px 10px; cursor: pointer;
      border: 1px solid var(--theme-line-soft); border-radius: 8px; background: transparent; color: var(--theme-text);
    }
    .flow-fields button:hover { background: var(--theme-surface-hover); }
    .flow-fields button.is-now { border-color: var(--theme-accent); color: var(--theme-heading); font-weight: 600; }
    .flow-fields small { color: var(--theme-faint); margin-left: 4px; white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <span class="hero-label">AP</span>
      <h1>スライドの読み流し動画</h1>
      <p>応用情報の図解スライドを1枚30秒で流しっぱなしにする、音のない動画。作業しながら眺める用。</p>
    </header>

    <section class="section">
      <div class="flow-tabs" role="group" aria-label="系統">
        <button type="button" data-group="all">全部（約10時間20分）</button>
        <button type="button" data-group="tech">テクノロジ系</button>
        <button type="button" data-group="mg">マネジメント系</button>
        <button type="button" data-group="st">ストラテジ系</button>
      </div>
      <video class="flow-video" controls muted playsinline preload="metadata"></video>
      <p class="flow-now" aria-live="polite"></p>
      <ul class="flow-fields"></ul>
    </section>

    <footer>資格学習支援サイト｜応用情報技術者試験</footer>
  </main>

  <script>
    // 動画は ap/terms/NN.pdf を ffmpeg で分野ごとに動画にし、系統でつないだもの（1枚30秒・分野の頭に10秒の表紙）。
    // GitHub の 1ファイル100MB制限のため、テクノロジ系は2本に分けて続けて再生する。
    const FILES = {
      "tech-1": ["01", "02", "03", "04", "05", "06"],
      "tech-2": ["07", "08", "09", "10", "11", "12", "13"],
      mg: ["14", "15", "16"],
      st: ["17", "18", "19", "20", "21", "22", "23"],
    };
    const GROUPS = { all: ["tech-1", "tech-2", "mg", "st"], tech: ["tech-1", "tech-2"], mg: ["mg"], st: ["st"] };
    const FIELDS = {
      "01": ["基礎理論", 1420], "02": ["アルゴリズムとプログラミング", 1240], "03": ["コンピュータ構成要素", 2350],
      "04": ["システム構成要素", 2650], "05": ["ソフトウェア", 2860], "06": ["ハードウェア", 2290],
      "07": ["ユーザーインタフェース", 1390], "08": ["情報メディア", 1180], "09": ["データベース", 1600],
      "10": ["ネットワーク", 1780], "11": ["セキュリティ", 1600], "12": ["システム開発技術", 1900],
      "13": ["ソフトウェア開発管理技術", 1450], "14": ["プロジェクトマネジメント", 1990], "15": ["サービスマネジメント", 1570],
      "16": ["システム監査", 1270], "17": ["システム戦略", 580], "18": ["システム企画", 610],
      "19": ["経営戦略マネジメント", 2460], "20": ["技術戦略マネジメント", 1200], "21": ["ビジネスインダストリ", 820],
      "22": ["企業活動", 1630], "23": ["法務", 1450],
    };
    const KEY = "ap-flow-video";

    const video = document.querySelector(".flow-video");
    const now = document.querySelector(".flow-now");
    const list = document.querySelector(".flow-fields");
    const tabs = [...document.querySelectorAll(".flow-tabs button")];
    let group = "all";
    let fileIndex = 0;

    const store = {
      get() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } },
      set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },
    };
    const fmt = (s) => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return h ? `${h}時間${m}分` : `${m}分`; };

    // 今のファイルの再生位置から、どの分野の何枚目かを出す
    function where(file, t) {
      let start = 0;
      for (const no of FILES[file]) {
        const len = FIELDS[no][1];
        if (t < start + len) {
          const inField = t - start;
          const page = inField < 10 ? 0 : Math.floor((inField - 10) / 30) + 1;
          return { no, page, total: (len - 10) / 30 };
        }
        start += len;
      }
      const last = FILES[file][FILES[file].length - 1];
      return { no: last, page: (FIELDS[last][1] - 10) / 30, total: (FIELDS[last][1] - 10) / 30 };
    }

    function load(file, t, play) {
      fileIndex = GROUPS[group].indexOf(file);
      video.src = `flow/${file}.mp4`;
      const seek = () => { video.currentTime = t || 0; if (play) video.play().catch(() => {}); };
      video.addEventListener("loadedmetadata", seek, { once: true });
    }

    function render() {
      tabs.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.group === group)));
      list.innerHTML = "";
      for (const file of GROUPS[group]) {
        let start = 0;
        for (const no of FILES[file]) {
          const li = document.createElement("li");
          const b = document.createElement("button");
          b.type = "button";
          b.dataset.no = no;
          b.innerHTML = `${no} ${FIELDS[no][0]}<small>${(FIELDS[no][1] - 10) / 30}枚</small>`;
          const at = start;
          b.addEventListener("click", () => {
            if (GROUPS[group][fileIndex] === file) { video.currentTime = at; video.play().catch(() => {}); }
            else load(file, at, true);
          });
          li.append(b);
          list.append(li);
          start += FIELDS[no][1];
        }
      }
    }

    function update() {
      const file = GROUPS[group][fileIndex];
      if (!file) return;
      const w = where(file, video.currentTime);
      now.innerHTML = w.page === 0
        ? `<strong>${w.no} ${FIELDS[w.no][0]}</strong>（表紙）`
        : `<strong>${w.no} ${FIELDS[w.no][0]}</strong>　${w.page} / ${w.total} 枚`;
      list.querySelectorAll("button").forEach((b) => b.classList.toggle("is-now", b.dataset.no === w.no));
    }

    let lastSave = 0;
    video.addEventListener("timeupdate", () => {
      update();
      if (Date.now() - lastSave > 5000) {
        lastSave = Date.now();
        const s = store.get();
        s.group = group;
        s[group] = { file: GROUPS[group][fileIndex], t: video.currentTime };
        store.set(s);
      }
    });
    // 1本終わったら同じ系統の次のファイルへ。最後まで行ったら頭に戻ってくり返す
    video.addEventListener("ended", () => {
      const files = GROUPS[group];
      load(files[(fileIndex + 1) % files.length], 0, true);
    });

    function choose(g, play) {
      group = g;
      const s = store.get();
      const pos = s[g] && GROUPS[g].includes(s[g].file) ? s[g] : { file: GROUPS[g][0], t: 0 };
      render();
      load(pos.file, pos.t, play);
      s.group = g;
      store.set(s);
    }
    tabs.forEach((b) => b.addEventListener("click", () => choose(b.dataset.group, true)));

    const saved = store.get().group;
    choose(GROUPS[saved] ? saved : "all", false);
    now.textContent = `全体の長さ：${fmt(Object.values(FIELDS).reduce((a, f) => a + f[1], 0))}。続きの位置は端末に覚えておく。`;
  </script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/site.js"></script>
</body>
</html>
