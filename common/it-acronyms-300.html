<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">

  <title>IT Acronyms 300｜共通教材</title>
  <style>
    :root {
      --bg: light-dark(#ffffff, #1e1f21);
      --c: light-dark(#f5f5f7, #272726);
      --t: light-dark(#1d1d1d, #dad3c9);
      --g: light-dark(#6e6e6e, #9b9791);
      --b: light-dark(#747474, #98938c);
      --l: light-dark(#ffffff, #21201f);
      --bd: light-dark(#e5e5e5, #3e3d3c)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--t);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif
    }

    .w {
      max-width: 1080px;
      margin: 0 auto;
      padding: 48px 20px
    }

    h1 {
      font-size: 44px;
      margin: 0;
      letter-spacing: -.02em
    }

    .sub {
      color: var(--g);
      margin: 8px 0 28px
    }

    .st {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px
    }

    .st div,
    .cd {
      background: var(--c);
      border: 1px solid var(--bd);
      border-radius: 22px;
      box-shadow: 0 2px 12px light-dark(rgba(0, 0, 0, 0.031), rgba(0, 0, 0, 0.088));
      padding: 18px
    }

    .st b {
      display: block;
      font-size: 28px
    }

    .st span {
      color: var(--g);
      font-size: 13px
    }

    .bar {
      height: 8px;
      background: var(--bd);
      border-radius: 8px;
      margin: 16px 0;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--b)
    }

    input,
    select,
    button {
      font: inherit;
      border-radius: 12px;
      border: 1px solid var(--bd);
      padding: 9px 14px;
      background: var(--c);
      color: var(--t)
    }

    button {
      cursor: pointer
    }

    button.on,
    button.p {
      background: var(--b);
      color: light-dark(#f5f5f7, #272726);
      border-color: var(--b)
    }

    #q {
      width: 100%;
      margin: 12px 0
    }

    .bar2 {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px
    }

    .a {
      font-size: 28px;
      font-weight: 700;
      color: var(--b)
    }

    .j {
      font-weight: 600
    }

    .f {
      color: var(--g);
      font-size: 13px
    }

    .mk {
      font-size: 12px;
      background: var(--l);
      color: var(--b);
      border-radius: 8px;
      padding: 2px 8px
    }

    details {
      margin-top: 8px;
      font-size: 14px
    }

    details p {
      margin: 4px 0
    }

    .big .a {
      font-size: 56px
    }

    .big {
      text-align: center;
      padding: 40px 20px
    }

    .ch {
      display: block;
      width: 100%;
      text-align: left;
      margin: 8px 0
    }

    .ok {
      background: light-dark(#ffffff, #21201f) !important
    }

    .ng {
      background: light-dark(#efefef, #353433) !important
    }

    .tg {
      margin: 6px 0 0
    }

    .tg:empty {
      display: none
    }

    .qj {
      font-size: 20px;
      margin: 8px 0 12px
    }

    #sc select {
      flex: 1 1 220px
    }

    @media(max-width:600px) {
      h1 {
        font-size: 32px
      }
    }
  </style>
</head>

        if (!S.qz) mkQuiz(); const z = S.qz; if (z.n >= z.q.length) { m.innerHTML = `<div class="cd"><h2>結果 ${z.sc} / ${z.q.length}点</h2><button class="p" data-a="qr">もう一度</button></div>`; return }
        const c = z.q[z.n], t = S.qt == "a2m"; m.innerHTML = `<p><button data-a="qt" data-v="a2m" class="${t ? "p" : ""}">略語→意味</button> <button data-a="qt" data-v="m2a" class="${t ? "" : "p"}">意味→略語</button></p><div class="cd"><p class="f">${z.n + 1}/${z.q.length}</p><div class="${t ? "a" : "j qj"}">${t ? c.x.a : c.x.j}</div>${c.o.map(y => `<button class="ch ${z.p === null ? "" : y.id == c.x.id ? "ok" : y.id == z.p ? "ng" : ""}" data-a="qa" data-id="${y.id}">${t ? y.f + "／" + y.j : y.a}</button>`).join("")}${z.p !== null ? `<p><button class="p" data-a="qn">次へ</button></p>${det(c.x).replace("<details ", "<details open ")}` : ""}</div>`
      }
    }
    document.addEventListener("click", e => {
      const b = e.target.closest("[data-a]"); if (!b) return; const a = b.dataset.a, id = +b.dataset.id;
      if (a == "mk") { e.stopPropagation(); M.has(id) ? M.delete(id) : M.add(id); save(); render(); return }
      if (a == "mode") { S.mode = b.dataset.v; S.rev = new Set(); if (S.mode == "rand") S.rs = null; if (S.mode == "quiz") S.qz = null }
      if (a == "ap") { S.ap = b.dataset.v; if (!S.ap) S.apf = ""; S.ci = 0; S.rs = null; S.qz = null; S.rev = new Set(); S.cat = ""; saveScope() }
      if (a == "rv") { S.rev.has(id) ? S.rev.delete(id) : S.rev.add(id) }
      if (a == "pv") S.ci = Math.max(0, S.ci - 1); if (a == "nx") S.ci++; if (a == "rr") { S.rs = null; S.rev = new Set() }
      if (a == "qt") { S.qt = b.dataset.v; S.qz = null } if (a == "qr") S.qz = null;
      if (a == "qa" && S.qz.p === null) { S.qz.p = id; if (id == S.qz.q[S.qz.n].x.id) S.qz.sc++ }
      if (a == "qn") { S.qz.n++; S.qz.p = null }
      render()
    });
    document.addEventListener("change", e => { const k = e.target.dataset.f; if (k) { S[k] = e.target.value; if (k == "sort") S.rn = []; if (k == "apf") { S.rs = null; S.qz = null; saveScope() } S.ci = 0; render() } });
    $("#q").addEventListener("input", e => { S.q = e.target.value; S.ci = 0; render() });
    render();
  </script>
  <script src="../assets/js/site.js"></script>
