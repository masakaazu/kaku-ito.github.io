<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IT Acronyms 300｜共通教材</title>
  <style>
    :root {
      --bg: #1e1f21;
      --c: #272726;
      --t: #dad3c9;
      --g: #9b9791;
      --b: #98938c;
      --l: #21201f;
      --bd: #3e3d3c
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--t);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif
    }

    .w {
      max-width: 1080px;
      margin: 0 auto;
      padding: 48px 20px
    }

    h1 {
      font-size: 44px;
      margin: 0;
      letter-spacing: -.02em
    }

    .sub {
      color: var(--g);
      margin: 8px 0 28px
    }

    .st {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px
    }

    .st div,
    .cd {
      background: var(--c);
      border: 1px solid var(--bd);
      border-radius: 22px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.088);
      padding: 18px
    }

    .st b {
      display: block;
      font-size: 28px
    }

    .st span {
      color: var(--g);
      font-size: 13px
    }

    .bar {
      height: 8px;
      background: var(--bd);
      border-radius: 8px;
      margin: 16px 0;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--b)
    }

    input,
    select,
    button {
      font: inherit;
      border-radius: 12px;
      border: 1px solid var(--bd);
      padding: 9px 14px;
      background: var(--c);
      color: var(--t)
    }

    button {
      cursor: pointer
    }

    button.on,
    button.p {
      background: var(--b);
      color: #272726;
      border-color: var(--b)
    }

    #q {
      width: 100%;
      margin: 12px 0
    }

    .bar2 {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px
    }

    .a {
      font-size: 28px;
      font-weight: 700;
      color: var(--b)
    }

    .j {
      font-weight: 600
    }

    .f {
      color: var(--g);
      font-size: 13px
    }

    .mk {
      font-size: 12px;
      background: var(--l);
      color: var(--b);
      border-radius: 8px;
      padding: 2px 8px
    }

    details {
      margin-top: 8px;
      font-size: 14px
    }

    details p {
      margin: 4px 0
    }

    .big .a {
      font-size: 56px
    }

    .big {
      text-align: center;
      padding: 40px 20px
    }

    .ch {
      display: block;
      width: 100%;
      text-align: left;
      margin: 8px 0
    }

    .ok {
      background: #21201f !important
    }

    .ng {
      background: #353433 !important
    }

    @media(max-width:600px) {
      h1 {
        font-size: 32px
      }
    }
  </style>
</head>

<body>
  <div class="w">
    <h1>IT Acronyms 300</h1>
    <p class="sub">ITエンジニアのための<br>「略語が分からない」をなくすIT略語帳</p>
    <div class="st" id="st"></div>
    <div class="bar"><i id="pb"></i></div>
    <input id="q" placeholder="略語・正式名称・日本語で検索（例: DNS / Domain Name / ドメイン名）">
    <div class="bar2" id="fl"></div>
    <div class="bar2" id="md"></div>
    <div id="main"></div>
    <p class="f">※頻出度(FE/AP/実務)は公式の出題頻度ではなく、編集上の学習優先度の目安です。</p>
  </div>

    const $ = s => document.querySelector(s);

    const S = { q: "", lv: "", cat: "", s: "", st: "", sort: "rec", mode: "list", ci: 0, rev: new Set(), rs: null, rn: [], qz: null, qt: "a2m" };
    const cats = [...new Set(D.map(x => x.cat))];
    const sh = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[a[i], a[j]] = [a[j], a[i]] } return a };
    function list() {
      let r = D.filter(x => { const q = S.q.trim().toLowerCase(); return (!q || [x.a, x.f, x.fk, x.j, x.r, x.m].join(" ").toLowerCase().includes(q)) && (!S.lv || x.lv == S.lv) && (!S.cat || x.cat == S.cat) && (!S.s || x.s == S.s) && (!S.st || (S.st == "m") == M.has(x.id)) });
      if (S.sort == "rec") r.sort((a, b) => b.p - a.p || b.s - a.s || a.id - b.id); if (S.sort == "az") r.sort((a, b) => a.a.localeCompare(b.a)); if (S.sort == "za") r.sort((a, b) => b.a.localeCompare(a.a)); if (S.sort == "imp") r.sort((a, b) => b.s - a.s); if (S.sort == "rnd") { if (!S.rn.length) S.rn = sh(D.map(x => x.id)); r.sort((a, b) => S.rn.indexOf(a.id) - S.rn.indexOf(b.id)) } return r
    }

    const mkBtn = x => `<button data-a="mk" data-id="${x.id}" class="${M.has(x.id) ? "on" : ""}">${M.has(x.id) ? "覚えた ✓" : "覚えた"}</button>`;
    const item = x => `<div class="cd ${S.mode == "card" ? "big" : ""}"><div class="a">${x.a}</div><div class="j">${x.j}</div><div class="f">${x.f}</div><div class="f">${x.i}</div>${det(x)}<p>${mkBtn(x)}</p></div>`;
    function head() { const n = D.length, m = M.size; $("#st").innerHTML = `<div><b>${n}</b><span>全略語数</span></div><div><b>${m}</b><span>覚えた</span></div><div><b>${n - m}</b><span>未習得</span></div><div><b>${(m / n * 100).toFixed(1)}%</b><span>進捗率 (${m}/${n})</span></div>`; $("#pb").style.width = m / n * 100 + "%"; }
    function sel(k, o, all) { return `<select data-f="${k}"><option value="">${all}</option>${o.map(v => `<option value="${v[0]}" ${S[k] == v[0] ? "selected" : ""}>${v[1]}</option>`).join("")}</select>` }
    function ctl() {
      $("#fl").innerHTML = sel("lv", [1, 2, 3].map(v => [v, "LEVEL " + v]), "LEVEL全て") + sel("cat", cats.map(v => [v, v]), "カテゴリ全て") + sel("s", [...new Set(D.map(x => x.s))].sort((a, b) => b - a).map(v => [v, "★" + v]), "重要度全て") + sel("st", [["m", "覚えた"], ["u", "未習得"]], "状態全て") + sel("sort", [["rec", "おすすめ順"], ["az", "A-Z"], ["za", "Z-A"], ["imp", "重要度順"], ["rnd", "ランダム"]], "").replace('<option value=""></option>', "");
      $("#md").innerHTML = [["list", "一覧"], ["card", "カード"], ["mem", "暗記"], ["rand", "ランダム学習"], ["quiz", "クイズ"]].map(v => `<button data-a="mode" data-v="${v[0]}" class="${S.mode == v[0] ? "p" : ""}">${v[1]}</button>`).join("")
    }
    function mkQuiz() { const q = sh(D).slice(0, Math.min(10, D.length)).map(x => { const o = sh(D.filter(y => y.id != x.id)).slice(0, 3).concat(x); return { x, o: sh(o) } }); S.qz = { q, n: 0, sc: 0, p: null } }
    function render() {
      head(); ctl(); const r = list(), m = $("#main");
      if (S.mode == "list") m.innerHTML = `<div class="grid">${r.map(item).join("") || "該当なし"}</div>`;
      else if (S.mode == "card") { if (S.ci >= r.length) S.ci = 0; const x = r[S.ci]; m.innerHTML = x ? `<p class="f">${S.ci + 1} / ${r.length}</p>${item(x)}<p><button data-a="pv">←</button> <button data-a="nx">→</button></p>` : "該当なし" }
      else if (S.mode == "mem") m.innerHTML = `<p class="f">タップで答えを表示</p><div class="grid">${r.map(x => S.rev.has(x.id) ? `<div class="cd" data-a="rv" data-id="${x.id}"><div class="a">${x.a}</div><div class="j">${x.j}</div><div class="f">${x.f}</div><div class="f">${x.i}</div><p>${x.m}</p><p>${mkBtn(x)}</p></div>` : `<div class="cd" data-a="rv" data-id="${x.id}"><div class="a">${x.a}</div><div class="f">タップで表示</div></div>`).join("")}</div>`;
      else if (S.mode == "rand") { if (!S.rs) { const u = D.filter(x => !M.has(x.id)); S.rs = sh(u).slice(0, 10).map(x => x.id) } const un = D.length - M.size; m.innerHTML = `<p><button data-a="rr">新しく選ぶ</button> ${un < 10 ? `残り${un}件` : ""}</p><div class="grid">${S.rs.map(i => D[i]).map(x => S.rev.has(x.id) ? item(x) : `<div class="cd" data-a="rv" data-id="${x.id}"><div class="a">${x.a}</div><div class="f">タップで表示</div>${mkBtn(x)}</div>`).join("") || "未習得はありません"}</div>` }
      else {
        if (!S.qz) mkQuiz(); const z = S.qz; if (z.n >= z.q.length) { m.innerHTML = `<div class="cd"><h2>結果 ${z.sc} / ${z.q.length}点</h2><button class="p" data-a="qr">もう一度</button></div>`; return }
        const c = z.q[z.n], t = S.qt == "a2m"; m.innerHTML = `<p><button data-a="qt" data-v="a2m" class="${t ? "p" : ""}">略語→意味</button> <button data-a="qt" data-v="m2a" class="${t ? "" : "p"}">意味→略語</button></p><div class="cd"><p class="f">${z.n + 1}/${z.q.length}</p><div class="a">${t ? c.x.a : c.x.j}</div>${c.o.map(y => `<button class="ch ${z.p === null ? "" : y.id == c.x.id ? "ok" : y.id == z.p ? "ng" : ""}" data-a="qa" data-id="${y.id}">${t ? y.f + "／" + y.j : y.a}</button>`).join("")}${z.p !== null ? `<p><button class="p" data-a="qn">次へ</button></p>` : ""}</div>`
      }
    }
    document.addEventListener("click", e => {
      const b = e.target.closest("[data-a]"); if (!b) return; const a = b.dataset.a, id = +b.dataset.id;
      if (a == "mk") { e.stopPropagation(); M.has(id) ? M.delete(id) : M.add(id); save(); render(); return }
      if (a == "mode") { S.mode = b.dataset.v; S.rev = new Set(); if (S.mode == "rand") S.rs = null; if (S.mode == "quiz") S.qz = null }
      if (a == "rv") { S.rev.has(id) ? S.rev.delete(id) : S.rev.add(id) }
      if (a == "pv") S.ci = Math.max(0, S.ci - 1); if (a == "nx") S.ci++; if (a == "rr") { S.rs = null; S.rev = new Set() }
      if (a == "qt") { S.qt = b.dataset.v; S.qz = null } if (a == "qr") S.qz = null;
      if (a == "qa" && S.qz.p === null) { S.qz.p = id; if (id == S.qz.q[S.qz.n].x.id) S.qz.sc++ }
      if (a == "qn") { S.qz.n++; S.qz.p = null }
      render()
    });
    document.addEventListener("change", e => { const k = e.target.dataset.f; if (k) { S[k] = e.target.value; if (k == "sort") S.rn = []; S.ci = 0; render() } });
    $("#q").addEventListener("input", e => { S.q = e.target.value; S.ci = 0; render() });
    render();
  </script>
