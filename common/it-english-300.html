<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
  <meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT English 300｜共通教材</title>
<style>
:root {
  --bg: light-dark(#ffffff, #1e1f21); --surface: light-dark(#f5f5f7, #272726); --surface-alt: light-dark(#ffffff, #1e1f21);
  --border: light-dark(#d3d3d3, #4e4d4b); --border-light: light-dark(#e5e5e5, #3e3d3c);
  --text: light-dark(#1d1d1d, #dad3c9); --text-muted: light-dark(#6e6e6e, #9b9791); --text-faint: light-dark(#aeaeae, #6b6966);
  --accent: light-dark(#7f7f7f, #8f8b85); --accent-hover: light-dark(#595959, #aca69e); --accent-light: light-dark(#f0f0f0, #343332);
  --success: light-dark(#248a3d, #4d724f); --success-light: light-dark(#ffffff, #21201f);
  --warning: light-dark(#b25000, #b58e6c); --danger: light-dark(#d70015, #b0776b);
  --radius: 16px; --radius-sm: 10px; --radius-xs: 8px;
  --shadow: 0 2px 8px light-dark(rgba(0, 0, 0, 0.046), rgba(0, 0, 0, 0.132));
  --shadow-lg: 0 8px 30px light-dark(rgba(0, 0, 0, 0.062), rgba(0, 0, 0, 0.176));
  --shadow-card: 0 1px 3px light-dark(rgba(0, 0, 0, 0.031), rgba(0, 0, 0, 0.088)), 0 1px 2px light-dark(rgba(0, 0, 0, 0.023), rgba(0, 0, 0, 0.066));
  --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  line-height: 1.5; transition: background var(--transition), color var(--transition);
  min-height: 100vh;
}
.container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }
.header { text-align: center; padding: 40px 0 32px; }
.header h1 {
  font-size: clamp(28px, 5vw, 42px); font-weight: 700; letter-spacing: -0.02em;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.header .subtitle { font-size: clamp(13px, 2.5vw, 16px); color: var(--text-muted); font-weight: 400; line-height: 1.6; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface); border-radius: var(--radius); padding: 20px; text-align: center;
  box-shadow: var(--shadow-card); border: 1px solid var(--border-light);
  transition: transform var(--transition);
}
.stat-card:hover { transform: translateY(-2px); }
.stat-value { font-size: clamp(22px, 4vw, 32px); font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
.stat-value.accent { color: var(--accent); }
.stat-value.success { color: var(--success); }
.stat-value.muted { color: var(--text-muted); }
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
.progress-section {
  background: var(--surface); border-radius: var(--radius); padding: 20px;
  margin-bottom: 24px; box-shadow: var(--shadow-card); border: 1px solid var(--border-light);
}
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.progress-title { font-size: 15px; font-weight: 600; color: var(--text); }
.progress-percent { font-size: 15px; font-weight: 700; color: var(--accent); }
.progress-bar { height: 8px; background: var(--border-light); border-radius: 4px; overflow: hidden; }
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent) 0%, var(--success) 100%);
  border-radius: 4px; transition: width 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); width: 0%;
}
.controls {
  background: var(--surface); border-radius: var(--radius); padding: 20px;
  margin-bottom: 24px; box-shadow: var(--shadow-card); border: 1px solid var(--border-light);
}
.search-box { position: relative; margin-bottom: 16px; }
.search-box input {
  width: 100%; padding: 12px 16px 12px 44px; font-size: 15px;
  border: 1px solid var(--border-light); border-radius: var(--radius-sm);
  background: var(--surface-alt); color: var(--text); font-family: inherit; transition: all var(--transition);
}
.search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-light); }
.search-box input::placeholder { color: var(--text-faint); }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-size: 18px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filter-group { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-label { font-size: 12px; color: var(--text-muted); font-weight: 600; align-self: center; margin-right: 4px; min-width: 50px; }
.chip {
  padding: 6px 14px; font-size: 13px; font-weight: 500;
  border: 1px solid var(--border-light); border-radius: 20px;
  background: var(--surface); color: var(--text-muted); cursor: pointer;
  transition: all var(--transition); white-space: nowrap; font-family: inherit;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--accent); color: light-dark(#f5f5f7, #272726); border-color: var(--accent); }
select.sort-select {
  padding: 6px 12px; font-size: 13px; border: 1px solid var(--border-light);
  border-radius: 20px; background: var(--surface); color: var(--text-muted);
  cursor: pointer; font-family: inherit; transition: all var(--transition);
}
select.sort-select:focus { outline: none; border-color: var(--accent); }
.mode-tabs { display: flex; gap: 4px; background: var(--surface-alt); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 24px; }
.mode-tab {
  flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 600;
  color: var(--text-muted); cursor: pointer; border-radius: var(--radius-xs);
  transition: all var(--transition); font-family: inherit; border: none; background: none;
}
.mode-tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-card); }
.word-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.word-card {
  background: var(--surface); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow-card); border: 1px solid var(--border-light);
  transition: all var(--transition); cursor: pointer; position: relative;
}
.word-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.word-card.known { opacity: 0.6; }
.word-card.known .word-english { text-decoration: line-through; text-decoration-color: var(--success); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.word-english { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
.word-reading { font-size: 13px; color: var(--text-faint); margin-bottom: 4px; }
.word-meaning { font-size: 15px; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
.word-image { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.5; }
.card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600; white-space: nowrap; }
.badge-l1 { background: light-dark(#f0f0f0, #343332); color: light-dark(#717171, #9a958e); }
.badge-l2 { background: light-dark(#ededed, #373634); color: light-dark(#d70015, #c2887b); }
.badge-l3 { background: light-dark(#f1f1f1, #333231); color: light-dark(#248a3d, #78a17c); }
.badge-cat { background: var(--surface-alt); color: var(--text-muted); }
.badge-imp { background: light-dark(#ffffff, #222018); color: light-dark(#b25000, #b78e6d); }
.card-details { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-light); }
.word-card.expanded .card-details { display: block; }
.detail-row { margin-bottom: 8px; font-size: 13px; line-height: 1.5; }
.detail-label { font-weight: 600; color: var(--text-muted); min-width: 70px; display: inline-block; }
.detail-value { color: var(--text); }
.known-btn {
  padding: 6px 16px; font-size: 13px; font-weight: 600; border-radius: 20px;
  border: none; cursor: pointer; transition: all var(--transition); font-family: inherit;
}
.known-btn.mark { background: var(--success-light); color: var(--success); border: 1px solid var(--success); }
.known-btn.mark:hover { background: var(--success); color: light-dark(#f5f5f7, #272726); }
.known-btn.unmark { background: var(--surface-alt); color: var(--text-muted); border: 1px solid var(--border-light); }
.known-btn.unmark:hover { background: var(--border-light); }
.priority-star { color: var(--warning); font-size: 14px; margin-left: 4px; }
.flashcard-container { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.flashcard {
  width: 100%; max-width: 500px; background: var(--surface); border-radius: var(--radius);
  padding: 40px 32px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-light);
  text-align: center; min-height: 300px; display: flex; flex-direction: column;
  justify-content: center; cursor: pointer; transition: all var(--transition); position: relative;
}
.flashcard:hover { box-shadow: 0 12px 40px light-dark(rgba(0, 0, 0, 0.092), rgba(0, 0, 0, 0.264)); }
.flashcard-word { font-size: clamp(28px, 6vw, 40px); font-weight: 700; letter-spacing: -0.02em; color: var(--text); margin-bottom: 8px; }
.flashcard-reading { font-size: 16px; color: var(--text-faint); margin-bottom: 24px; }
.flashcard-hidden { font-size: 14px; color: var(--text-faint); font-style: italic; }
.flashcard-revealed { display: none; }
.flashcard.flipped .flashcard-hidden { display: none; }
.flashcard.flipped .flashcard-revealed { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.flashcard-meaning { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 12px; }
.flashcard-image { font-size: 15px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; }
.flashcard-itmeaning { font-size: 14px; color: var(--text); line-height: 1.6; margin-bottom: 16px; text-align: left; }
.flashcard-example { font-size: 13px; color: var(--text-muted); font-style: italic; margin-top: 8px; }
.flashcard-nav { display: flex; gap: 12px; align-items: center; }
.nav-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-light);
  background: var(--surface); color: var(--text); cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center; transition: all var(--transition); font-family: inherit;
}
.nav-btn:hover { background: var(--accent); color: light-dark(#f5f5f7, #272726); border-color: var(--accent); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-counter { font-size: 14px; font-weight: 600; color: var(--text-muted); min-width: 60px; text-align: center; }
.memorize-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.memorize-card {
  background: var(--surface); border-radius: var(--radius); padding: 24px;
  box-shadow: var(--shadow-card); border: 1px solid var(--border-light);
  cursor: pointer; transition: all var(--transition); text-align: center;
  min-height: 120px; display: flex; flex-direction: column; justify-content: center; position: relative;
}
.memorize-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.memorize-word { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.memorize-reading { font-size: 13px; color: var(--text-faint); }
.memorize-hidden { font-size: 13px; color: var(--text-faint); font-style: italic; margin-top: 8px; }
.memorize-revealed { display: none; }
.memorize-card.flipped .memorize-word { font-size: 18px; }
.memorize-card.flipped .memorize-revealed { display: block; animation: fadeIn 0.3s ease; }
.memorize-card.flipped .memorize-hidden { display: none; }
.memorize-meaning { font-size: 18px; font-weight: 700; color: var(--accent); margin-top: 8px; }
.memorize-image { font-size: 13px; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }
.memorize-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: center; }
.quiz-container { max-width: 600px; margin: 0 auto; }
.quiz-question {
  background: var(--surface); border-radius: var(--radius); padding: 32px;
  box-shadow: var(--shadow-card); border: 1px solid var(--border-light);
  text-align: center; margin-bottom: 16px;
}
.quiz-label { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
.quiz-word { font-size: clamp(24px, 5vw, 36px); font-weight: 700; color: var(--text); margin-bottom: 24px; }
.quiz-options { display: grid; gap: 10px; }
.quiz-option {
  padding: 16px 20px; background: var(--surface); border: 2px solid var(--border-light);
  border-radius: var(--radius-sm); font-size: 15px; font-weight: 500; color: var(--text);
  cursor: pointer; transition: all var(--transition); text-align: left; font-family: inherit;
}
.quiz-option:hover { border-color: var(--accent); background: var(--accent-light); }
.quiz-option.correct { border-color: var(--success); background: var(--success-light); color: var(--success); }
.quiz-option.wrong { border-color: var(--danger); background: light-dark(rgba(215, 0, 21, 0.1), rgba(176, 119, 107, 0.1)); color: var(--danger); }
.quiz-option.disabled { pointer-events: none; }
.quiz-result { text-align: center; padding: 20px; font-size: 16px; font-weight: 600; margin-top: 16px; }
.quiz-score { display: flex; justify-content: center; gap: 24px; margin-bottom: 24px; }
.score-item { text-align: center; }
.score-value { font-size: 28px; font-weight: 700; }
.score-value.correct { color: var(--success); }
.score-value.wrong { color: var(--danger); }
.score-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.random-btn {
  padding: 10px 24px; font-size: 14px; font-weight: 600; border-radius: 20px;
  background: var(--accent); color: light-dark(#f5f5f7, #272726); border: none; cursor: pointer;
  transition: all var(--transition); font-family: inherit;
}
.random-btn:hover { background: var(--accent-hover); transform: scale(1.02); }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
.empty-state-text { font-size: 16px; font-weight: 500; }
@media (max-width: 768px) {
  .container { padding: 16px 12px 60px; }
  .header { padding: 24px 0 20px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .word-list, .memorize-grid { grid-template-columns: 1fr; }
  .filter-row { flex-direction: column; align-items: flex-start; }
  .filter-group { width: 100%; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
  .flashcard { padding: 28px 20px; min-height: 240px; }
}
@media (max-width: 480px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat-card { padding: 14px; }
  .stat-value { font-size: 22px; }
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>IT English 300</h1>
    <p class="subtitle">ITエンジニアのための<br>「意味が分からない」をなくす英単語帳</p>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-value" id="statTotal">300</div><div class="stat-label">全単語数</div></div>
    <div class="stat-card"><div class="stat-value success" id="statKnown">0</div><div class="stat-label">覚えた</div></div>
    <div class="stat-card"><div class="stat-value muted" id="statUnknown">300</div><div class="stat-label">未習得</div></div>
    <div class="stat-card"><div class="stat-value accent" id="statPercent">0%</div><div class="stat-label">進捗率</div></div>
  </div>
  <div class="progress-section">
    <div class="progress-header">
      <span class="progress-title">学習進捗</span>
      <span class="progress-percent" id="progressText">0 / 300</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="controls">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="英単語または日本語で検索">
    </div>
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">LEVEL</span>
        <button class="chip active" data-filter="level" data-value="0">全て</button>
        <button class="chip" data-filter="level" data-value="1">L1</button>
        <button class="chip" data-filter="level" data-value="2">L2</button>
        <button class="chip" data-filter="level" data-value="3">L3</button>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">カテゴリ</span>
        <button class="chip active" data-filter="category" data-value="all">全て</button>
        <button class="chip" data-filter="category" data-value="01 IT基礎">01</button>
        <button class="chip" data-filter="category" data-value="02 コンピュータ構成">02</button>
        <button class="chip" data-filter="category" data-value="03 OS">03</button>
        <button class="chip" data-filter="category" data-value="04 アルゴリズム">04</button>
        <button class="chip" data-filter="category" data-value="05 プログラミング">05</button>
        <button class="chip" data-filter="category" data-value="06 ソフトウェア開発">06</button>
        <button class="chip" data-filter="category" data-value="07 Git/GitHub">07</button>
        <button class="chip" data-filter="category" data-value="08 データベース">08</button>
        <button class="chip" data-filter="category" data-value="09 ネットワーク">09</button>
        <button class="chip" data-filter="category" data-value="10 Web">10</button>
        <button class="chip" data-filter="category" data-value="11 セキュリティ">11</button>
        <button class="chip" data-filter="category" data-value="12 Linux">12</button>
        <button class="chip" data-filter="category" data-value="13 クラウド">13</button>
        <button class="chip" data-filter="category" data-value="14 AWS/Azure">14</button>
        <button class="chip" data-filter="category" data-value="15 Docker/Kubernetes">15</button>
        <button class="chip" data-filter="category" data-value="16 DevOps/CI-CD">16</button>
        <button class="chip" data-filter="category" data-value="17 システム設計">17</button>
        <button class="chip" data-filter="category" data-value="18 インフラ">18</button>
        <button class="chip" data-filter="category" data-value="19 AI">19</button>
        <button class="chip" data-filter="category" data-value="20 プロジェクト管理">20</button>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">重要度</span>
        <button class="chip active" data-filter="importance" data-value="0">全て</button>
        <button class="chip" data-filter="importance" data-value="5">★★★★★</button>
        <button class="chip" data-filter="importance" data-value="4">★★★★</button>
        <button class="chip" data-filter="importance" data-value="3">★★★</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">状態</span>
        <button class="chip active" data-filter="status" data-value="all">全て</button>
        <button class="chip" data-filter="status" data-value="known">覚えた</button>
        <button class="chip" data-filter="status" data-value="unknown">未習得</button>
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="recommended">おすすめ順</option>
        <option value="az">A-Z</option>
        <option value="za">Z-A</option>
        <option value="importance">重要度順</option>
        <option value="random">ランダム</option>
      </select>
    </div>
    <div class="filter-row" style="justify-content: center; margin-top: 8px;">
      <button class="random-btn" id="randomBtn">🎲 ランダム10語</button>
    </div>
  </div>
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="list">一覧</button>
    <button class="mode-tab" data-mode="card">カード</button>
    <button class="mode-tab" data-mode="memorize">暗記</button>
    <button class="mode-tab" data-mode="quiz">クイズ</button>
  </div>
  <div id="contentArea"></div>

    h += '<div class="detail-row"><span class="detail-label">関連語</span><span class="detail-value">' + escapeHtml(w.related) + '</span></div>';
    h += '<div class="detail-row"><span class="detail-label">混同しやすい</span><span class="detail-value">' + escapeHtml(w.confusing) + '</span></div>';
    h += '<div class="detail-row"><span class="detail-label">違い</span><span class="detail-value">' + escapeHtml(w.difference) + '</span></div>';
    h += '<div class="detail-row"><span class="detail-label">FE</span><span class="detail-value">' + w.fe + '</span></div>';
    h += '<div class="detail-row"><span class="detail-label">AP</span><span class="detail-value">' + w.ap + '</span></div>';
    h += '<div class="detail-row"><span class="detail-label">実務</span><span class="detail-value">' + w.practical + '</span></div>';
    h += '</div></div>';
  });
  h += '</div>';
  area.innerHTML = h;
  document.querySelectorAll('.word-card').forEach(function(card) {
    card.addEventListener('click', function(e) {
      if (e.target.classList.contains('known-btn')) { e.stopPropagation(); toggleKnown(e.target.getAttribute('data-word')); return; }
      card.classList.toggle('expanded');
    });
  });
}

function renderCard() {
  const area = document.getElementById('contentArea');
  if (flashcardIndex >= filteredWords.length) flashcardIndex = 0;
  const w = filteredWords[flashcardIndex];
  const isKnown = knownWords.has(w.word);
  let h = '<div class="flashcard-container">';
  h += '<div class="flashcard" id="flashcard">';
  h += '<div class="flashcard-word">' + escapeHtml(w.word) + (w.priority50 ? '<span class="priority-star">⭐</span>' : '') + '</div>';
  h += '<div class="flashcard-reading">' + escapeHtml(w.reading) + '</div>';
  h += '<div class="flashcard-hidden">クリックして意味を表示</div>';
  h += '<div class="flashcard-revealed">';
  h += '<div class="flashcard-meaning">' + escapeHtml(w.meaning) + '</div>';
  h += '<div class="flashcard-image">' + escapeHtml(w.image) + '</div>';
  h += '<div class="flashcard-itmeaning">' + escapeHtml(w.itMeaning) + '</div>';
  h += '<div class="flashcard-example">例: ' + escapeHtml(w.example) + '</div>';
  h += '</div></div>';
  h += '<div class="flashcard-nav">';
  h += '<button class="nav-btn" id="prevBtn"' + (flashcardIndex === 0 ? ' disabled' : '') + '>‹</button>';
  h += '<span class="nav-counter">' + (flashcardIndex + 1) + ' / ' + filteredWords.length + '</span>';
  h += '<button class="nav-btn" id="nextBtn"' + (flashcardIndex >= filteredWords.length - 1 ? ' disabled' : '') + '>›</button>';
  h += '</div>';
  h += '<button class="known-btn ' + (isKnown ? 'unmark' : 'mark') + '" style="font-size:14px;padding:8px 24px;" data-word="' + escapeHtml(w.word) + '">' + (isKnown ? '覚えた ✓' : '覚えた') + '</button>';
  h += '</div>';
  area.innerHTML = h;
  document.getElementById('flashcard').addEventListener('click', function() { this.classList.toggle('flipped'); });
  document.getElementById('prevBtn').addEventListener('click', function(e) { e.stopPropagation(); if (flashcardIndex > 0) { flashcardIndex--; renderCard(); } });
  document.getElementById('nextBtn').addEventListener('click', function(e) { e.stopPropagation(); if (flashcardIndex < filteredWords.length - 1) { flashcardIndex++; renderCard(); } });
  document.querySelector('.known-btn[data-word]').addEventListener('click', function(e) { e.stopPropagation(); toggleKnown(this.getAttribute('data-word')); });
}

function renderMemorize() {
  const area = document.getElementById('contentArea');
  let h = '<div class="memorize-grid">';
  filteredWords.forEach(function(w, idx) {
    const isKnown = knownWords.has(w.word);
    h += '<div class="memorize-card" data-idx="' + idx + '">';
    h += '<div class="memorize-word">' + escapeHtml(w.word) + '</div>';
    h += '<div class="memorize-reading">' + escapeHtml(w.reading) + '</div>';
    h += '<div class="memorize-hidden">クリックして表示</div>';
    h += '<div class="memorize-revealed">';
    h += '<div class="memorize-meaning">' + escapeHtml(w.meaning) + '</div>';
    h += '<div class="memorize-image">' + escapeHtml(w.image) + '</div>';
    h += '</div>';
    h += '<div class="memorize-actions">';
    h += '<button class="known-btn ' + (isKnown ? 'unmark' : 'mark') + '" data-word="' + escapeHtml(w.word) + '" style="font-size:12px;padding:4px 12px;">' + (isKnown ? '✓' : '覚えた') + '</button>';
    h += '</div></div>';
  });
  h += '</div>';
  area.innerHTML = h;
  document.querySelectorAll('.memorize-card').forEach(function(card) {
    card.addEventListener('click', function(e) {
      if (e.target.classList.contains('known-btn')) { e.stopPropagation(); toggleKnown(e.target.getAttribute('data-word')); return; }
      card.classList.toggle('flipped');
    });
  });
}

function renderQuiz() {
  const area = document.getElementById('contentArea');
  if (quizState.questions.length === 0 || quizState.currentIndex >= quizState.questions.length) {
    quizState.questions = generateQuizQuestions();
    quizState.currentIndex = 0; quizState.score = 0; quizState.wrong = 0;
  }
  if (quizState.currentIndex >= quizState.questions.length) {
    const total = quizState.questions.length;
    let h = '<div class="quiz-container"><div class="quiz-question">';
    h += '<div class="quiz-label">クイズ結果</div>';
    h += '<div class="quiz-score">';
    h += '<div class="score-item"><div class="score-value correct">' + quizState.score + '</div><div class="score-label">正解</div></div>';
    h += '<div class="score-item"><div class="score-value wrong">' + quizState.wrong + '</div><div class="score-label">不正解</div></div>';
    h += '<div class="score-item"><div class="score-value accent">' + Math.round(quizState.score / total * 100) + '%</div><div class="score-label">正答率</div></div>';
    h += '</div><button class="random-btn" id="quizRestart" style="margin-top:16px;">もう一度</button>';
    h += '</div></div>';
    area.innerHTML = h;
    document.getElementById('quizRestart').addEventListener('click', function() { quizState.questions = []; quizState.currentIndex = 0; renderQuiz(); });
    return;
  }
  const q = quizState.questions[quizState.currentIndex];
  quizState.answered = false;
  let h = '<div class="quiz-container">';
  h += '<div class="quiz-question">';
  h += '<div class="quiz-label">' + (q.direction === 'en2ja' ? '英語 → 日本語' : '日本語 → 英語') + ' (' + (quizState.currentIndex + 1) + '/' + quizState.questions.length + ')</div>';
  h += '<div class="quiz-word">' + escapeHtml(q.question) + '</div>';
  h += '</div><div class="quiz-options">';
  q.options.forEach(function(opt, i) { h += '<button class="quiz-option" data-index="' + i + '">' + escapeHtml(opt) + '</button>'; });
  h += '</div><div class="quiz-result" id="quizResult"></div></div>';
  area.innerHTML = h;
  document.querySelectorAll('.quiz-option').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (quizState.answered) return;
      quizState.answered = true;
      const selected = parseInt(this.getAttribute('data-index'));
      const correctIdx = q.correctIndex;
      document.querySelectorAll('.quiz-option').forEach(function(b) { b.classList.add('disabled'); });
      if (selected === correctIdx) {
        this.classList.add('correct'); quizState.score++;
        document.getElementById('quizResult').innerHTML = '<span style="color:var(--success)">✓ 正解！</span>';
      } else {
        this.classList.add('wrong');
        document.querySelector('.quiz-option[data-index="' + correctIdx + '"]').classList.add('correct');
        quizState.wrong++;
        document.getElementById('quizResult').innerHTML = '<span style="color:var(--danger)">✗ 不正解。正解: ' + escapeHtml(q.options[correctIdx]) + '</span>';
      }
      setTimeout(function() { quizState.currentIndex++; renderQuiz(); }, 1500);
    });
  });
}

function generateQuizQuestions() {
  const pool = filteredWords.length >= 10 ? filteredWords : WORDS;
  const questions = [];
  const used = new Set();
  const count = Math.min(10, pool.length);
  while (questions.length < count) {
    const idx = Math.floor(Math.random() * pool.length);
    const w = pool[idx];
    if (used.has(w.word)) continue;
    used.add(w.word);
    const direction = Math.random() < 0.5 ? 'en2ja' : 'ja2en';
    const question = direction === 'en2ja' ? w.word : w.meaning;
    const answer = direction === 'en2ja' ? w.meaning : w.word;
    const distractors = [];
    const usedDistractors = new Set([answer]);
    while (distractors.length < 3) {
      const dIdx = Math.floor(Math.random() * WORDS.length);
      const dW = WORDS[dIdx];
      const dAns = direction === 'en2ja' ? dW.meaning : dW.word;
      if (usedDistractors.has(dAns) || dAns === answer) continue;
      usedDistractors.add(dAns); distractors.push(dAns);
    }
    const options = [answer, ...distractors];
    for (let i = options.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [options[i], options[j]] = [options[j], options[i]]; }
    questions.push({ question: question, options: options, correctIndex: options.indexOf(answer), direction: direction });
  }
  return questions;
}

function toggleKnown(word) {
  if (knownWords.has(word)) knownWords.delete(word); else knownWords.add(word);
  _safeStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(knownWords)));
  updateStats();
  if (isRandomSession && currentMode === 'card') {
    const btn = document.querySelector('.known-btn[data-word]');
    const isKnown = knownWords.has(word);
    if (btn) { btn.className = 'known-btn ' + (isKnown ? 'unmark' : 'mark'); btn.textContent = isKnown ? '覚えた ✓' : '覚えた'; }
  } else {
    render();
  }
}

function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

document.getElementById('searchInput').addEventListener('input', function(e) {
  currentSearch = e.target.value;
  if (isRandomSession) { isRandomSession = false; randomSessionWords = []; }
  render();
});

document.querySelectorAll('.chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    const filterType = this.getAttribute('data-filter');
    const value = this.getAttribute('data-value');
    document.querySelectorAll('.chip[data-filter="' + filterType + '"]').forEach(function(c) { c.classList.remove('active'); });
    this.classList.add('active');
    if (filterType === 'level') currentFilters.level = parseInt(value);
    else if (filterType === 'category') currentFilters.category = value;
    else if (filterType === 'importance') currentFilters.importance = parseInt(value);
    else if (filterType === 'status') currentFilters.status = value;
    isRandomSession = false; randomSessionWords = []; flashcardIndex = 0;
    render();
  });
});

document.getElementById('sortSelect').addEventListener('change', function(e) {
  currentSort = e.target.value;
  isRandomSession = false; randomSessionWords = []; flashcardIndex = 0;
  render();
});

document.querySelectorAll('.mode-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
    this.classList.add('active');
    currentMode = this.getAttribute('data-mode');
    flashcardIndex = 0;
    if (currentMode === 'quiz') { quizState.questions = []; quizState.currentIndex = 0; }
    render();
  });
});

document.getElementById('randomBtn').addEventListener('click', function() {
  let unknown = WORDS.filter(function(w) { return !knownWords.has(w.word); });
  if (unknown.length === 0) unknown = WORDS;
  const pool = unknown.length >= 10 ? unknown : WORDS;
  const random10 = shuffleArray(pool).slice(0, Math.min(10, pool.length));
  isRandomSession = true; randomSessionWords = random10;
  currentFilters = { level: 0, category: 'all', importance: 0, status: 'all' };
  currentSearch = ''; currentSort = 'recommended';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.chip').forEach(function(c) {
    c.classList.remove('active');
    const ft = c.getAttribute('data-filter'); const val = c.getAttribute('data-value');
    if ((ft === 'level' && val === '0') || (ft === 'category' && val === 'all') || (ft === 'importance' && val === '0') || (ft === 'status' && val === 'all')) c.classList.add('active');
  });
  document.getElementById('sortSelect').value = 'recommended';
  currentMode = 'card';
  document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelector('.mode-tab[data-mode="card"]').classList.add('active');
  flashcardIndex = 0;
  renderCard();
});

document.addEventListener('keydown', function(e) {
  if (currentMode !== 'card') return;
  if (e.key === 'ArrowLeft' && flashcardIndex > 0) { flashcardIndex--; renderCard(); }
  else if (e.key === 'ArrowRight' && flashcardIndex < filteredWords.length - 1) { flashcardIndex++; renderCard(); }
  else if (e.key === ' ' || e.key === 'Enter') { const fc = document.getElementById('flashcard'); if (fc) fc.classList.toggle('flipped'); }
});

updateStats();
render();
</script>
