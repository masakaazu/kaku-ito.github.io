<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>基本情報技術者試験｜資格学習支援サイト</title>
  <link rel="stylesheet" href="../assets/css/site.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
</head>

<body>
  <main>
    <header class="hero">
      <span class="hero-label">FE</span>
      <h1>基本情報技術者試験</h1>
      <p>受験済みの資格。日別の復習教材を、分野からも日付からも引けるように残している。</p>

      <div class="hero-meta">
        <span data-site-text="fe:status"></span>
        <span data-site-text="fe:exam"></span>
        <span>教材のある分野：<span data-site-text="fe:fields"></span></span>
      </div>
    </header>

    <section class="section">
      <div class="section-title">
        <h2>分野マップ</h2>
        <span>シラバスの中分類</span>
      </div>
      <p class="legend">教材のある分野を開くと、ノート・用語集・問題演習を型ごとに一覧できる。<span data-rate-note hidden>右上の数字は正答率（60%未満は赤）。</span></p>

      <div data-site-list="field-map" data-topic="fe"></div>
    </section>

    <section class="section" data-wrong-section hidden>
      <div class="section-title">
        <h2>間違えた問題</h2>
        <span>最後の回答が不正解のまま</span>
      </div>
      <p class="legend">正解するとここから消える。用語集は、間違えた用語だけのクイズで開く。</p>

      <div data-site-list="wrong" data-topic="fe"></div>
    </section>

    <section class="section">
      <div class="section-title">
        <h2>日別復習</h2>
        <span data-site-text="fe:days"></span>
      </div>

      <div data-site-list="days" data-topic="fe"></div>
    </section>

    <footer>資格学習支援サイト｜基本情報技術者試験</footer>
  </main>

  <script src="../assets/js/catalog.js"></script>
  <script src="../assets/js/site.js"></script>
</body>
</html>
